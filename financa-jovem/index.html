<script id="finance-model">
'use strict';
const Finance = {
 risk(capital,years,rate,cost=0){return capital*Math.pow((1+rate/100)*(1-cost/100),years)},
 stockBusiness(price,unit,fixed,produced,sold){const revenue=price*sold,cost=fixed+unit*produced;return{revenue,cost,profit:revenue-cost,breakEven:price>0?Math.ceil(cost/price):null}},
 money(v){return new Intl.NumberFormat('pt-PT',{style:'currency',currency:'EUR'}).format(v)},
 round(v){return Math.round((v+Number.EPSILON)*100)/100},
 savings(initial,monthly,months,annual){const r=Math.pow(1+annual/100,1/12)-1;let v=initial;const series=[v];for(let i=0;i<months;i++){v=v*(1+r)+monthly;series.push(v)}return{value:v,paid:initial+monthly*months,gain:v-initial-monthly*months,series}},
 credit(capital,annual,months,fees){const r=annual/1200;const payment=r===0?capital/months:capital*r/(1-Math.pow(1+r,-months));return{payment,total:payment*months+fees,interest:payment*months-capital,fees}},
 budget(income,essential,leisure,saving,reserve,shock=0){const spend=essential+leisure+shock;return{spend,allocated:spend+saving+reserve,free:income-spend-saving-reserve,remaining:income-spend}},
 goal(target,initial,entries){const total=initial+Object.values(entries).reduce((a,b)=>a+b,0);return{total,remaining:Math.max(0,target-total),percent:Math.min(100,total/target*100)}},
 buy(price,volume,need,delivery=0){const packs=Math.ceil(need/volume);return{unit:price/volume,packs,total:packs*price+delivery,excess:packs*volume-need}},
 vat(price,rate,included){const net=included?price/(1+rate/100):price;return{net,tax:net*rate/100,total:net*(1+rate/100)}},
 business(price,unit,fixed,quantity){const margin=price-unit;return{revenue:price*quantity,cost:fixed+unit*quantity,profit:margin*quantity-fixed,breakEven:margin>0?Math.ceil(fixed/margin):null}},
 date(){const d=new Date();return[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')},
 days(a,b){return Math.round((Date.parse(b+'T12:00:00Z')-Date.parse(a+'T12:00:00Z'))/86400000)}
};
</script>

function missionBalance(){return cfg().budget-(state.mission?.choices||[]).reduce((sum,v,i)=>sum+currentEvents()[i].options[v][1],0)}
function mission(){
 const c=cfg(),m=state.mission,E=currentEvents();
 if(!m)return `${title(c.missionTitle,c.missionIntro,'Missão · '+c.name)}<div class="two-col"><section class="card"><div class="eyebrow">O TEU PLANO ANTES DE ESCOLHER</div><h2>${state.level==='primeiro'?'Vamos encher o mealheiro?':'O que queres conseguir?'}</h2><div class="stats"><div class="stat"><span class="label">Para as escolhas</span><strong>${money(c.budget)}</strong></div><div class="stat"><span class="label">Já guardado</span><strong>${money(c.initial)}</strong></div><div class="stat purple"><span class="label">Meta final</span><strong>${money(c.target)}</strong></div></div><div class="notice green">${state.level==='primeiro'?`Já tens ${money(c.initial)}. Para chegar a ${money(c.target)}, faltam ${money(c.target-c.initial)}.`:`Para chegar à meta, precisas de guardar mais ${money(c.target-c.initial)}. Vais comparar o plano com o resultado das quatro escolhas.`}</div>${moneyCoins(c.budget)}<form id="mission-start"><div class="field"><label for="mission-plan">Quanto planeias guardar dos ${money(c.budget)}?</label><input id="mission-plan" type="number" min="0" max="${c.budget}" step="1" value="${c.plan}" required><small>Este é o teu plano. O dinheiro que sobra só é guardado no final da missão.</small></div><button class="btn">Começar: ${c.missionTitle} →</button></form></section><aside class="card"><h3>Quatro escolhas, passo a passo</h3><ol class="list"><li>${state.level==='primeiro'?'Lê com um adulto, se precisares.':'Lê o contexto e os valores.'}</li><li>Escolhe uma alternativa.</li><li>Vê quanto fica e lê a explicação.</li><li>${state.level==='secundario'?'Conta também o dinheiro já comprometido para meses futuros.':'Compara o que guardaste com o teu plano.'}</li></ol><div class="notice">Podes sair e retomar. Esta missão pertence ao percurso ${c.name.toLowerCase()}. Mudar de ciclo preserva-a.</div></aside></div>`;
 const n=m.choices.length,balance=missionBalance(),debt=missionDebt(),done=n===E.length;
 if(done){const saved=missionSaved(),total=c.initial+saved;return `${title(c.missionTitle+' · concluída','Olha para a escolha, a conta e a consequência.','4 de 4 '+c.periodPlural)}<section class="card"><div class="result-hero"><div class="result-icon" aria-hidden="true">✦</div><span class="tag green">${c.name}</span><h2>${total>=c.target?'A meta ficou ao teu alcance.':'A meta pede um novo plano.'}</h2><p>${state.level==='primeiro'?`Tinham ficado ${money(balance)}. Juntaste esse dinheiro aos ${money(c.initial)} que já estavam no mealheiro.`:`Depois das despesas, ficaram ${money(balance)}. ${debt?`Reservámos ${money(debt)} para pagamentos futuros já assumidos; a poupança livre deste mês é ${money(saved)}.`:`Esse saldo pode ser guardado para a meta.`}`}</p></div><div class="stats"><div class="stat"><span class="label">Gasto agora</span><strong>${money(c.budget-balance)}</strong></div><div class="stat purple"><span class="label">Poupança final livre</span><strong>${money(total)}</strong></div><div class="stat green"><span class="label">Meta</span><strong>${money(c.target)}</strong></div></div>${moneyCoins(total)}<div class="notice ${saved>=m.plan?'green':'peach'}">Planeavas guardar ${money(m.plan)} e conseguiste guardar ${money(saved)} livres. ${total<c.target?'Faltam '+money(c.target-total)+' para a meta.':'A meta foi atingida neste cenário.'} ${debt?'O dinheiro reservado para prestações futuras não foi contado como poupança livre.':''}</div><div class="two-col"><div><h3 class="subheading">As tuas escolhas</h3>${missionHistory()}</div><div><div class="field"><label for="mission-reflection">${c.reflection}</label><textarea id="mission-reflection" maxlength="1500" placeholder="Escolhi… porque…">${esc(m.reflection||'')}</textarea></div><div class="actions"><button class="btn" data-go="progresso">Ver o meu percurso</button><button class="btn secondary" data-action="restart-mission">Experimentar outras escolhas</button></div></div></div></section>`}
 const answered=m.pending!==null,e=E[n],option=answered?e.options[m.pending-1]:null,cost=option?.[1]||0,future=option?.[3]?.future||0;
 return `${title(c.missionTitle,c.missionIntro,c.period[0].toUpperCase()+c.period.slice(1)+' '+(n+1)+' de 4')}<div class="stats"><div class="stat purple"><span class="label">Disponível ${answered?'depois da escolha':'agora'}</span><strong>${money(balance-cost)}</strong></div><div class="stat"><span class="label">Plano: guardar</span><strong>${money(m.plan)}</strong></div><div class="stat green"><span class="label">${state.level==='secundario'?'Compromissos futuros':'Já no mealheiro'}</span><strong>${money(state.level==='secundario'?debt+future:c.initial)}</strong></div></div>${moneyCoins(balance-cost)}<div class="steps" aria-label="${n} de 4 escolhas concluídas">${E.map((x,i)=>`<span class="step ${i<n?'done':''}"></span>`).join('')}</div><div class="two-col"><section class="card"><div class="decision-scene"><div class="scene-symbol" aria-hidden="true">${e.icon}</div><div class="eyebrow">${c.period.toUpperCase()} ${n+1}</div><h2>${e.title}</h2><p>${e.text}</p></div>${e.options.map(([label,amount,feedback,commitment],i)=>`<button class="choice ${answered&&m.pending===i+1?'chosen':''}" data-choice="${i}" ${answered||amount>balance?'disabled':''}><span class="circle">${i+1}</span><span><strong>${label}</strong>${amount>balance?'<small>O dinheiro disponível não chega para esta escolha.</small>':commitment?.future?`<small>Mais ${money(commitment.future)} a pagar depois deste mês.</small>`:''}</span><span class="price">${money(amount)}</span></button>`).join('')}${answered?`<div class="notice green" role="status"><strong>O que aconteceu?</strong><br>${option[2]}<br>${state.level==='primeiro'?`${money(balance)} − ${money(cost)} = ${money(balance-cost)}.`:`Ficas com ${money(balance-cost)} disponíveis agora.`}</div><button class="btn" data-action="mission-next">${n===3?'Ver o resultado':'Próxima escolha'} →</button>`:`<p class="metric-note">${state.level==='primeiro'?'Escolhe. Depois conta quanto dinheiro ficou.':'Compara uma alternativa com o que terias de deixar para depois.'}</p>`}</section><aside class="stack"><section class="card"><h3>O teu plano</h3><p class="lead">Guardar ${money(m.plan)} e usar até ${money(c.budget-m.plan)} nas escolhas.</p><div class="notice">Já gastaste ${money(c.budget-balance+cost)}. ${state.level==='secundario'?`Além disso, estão comprometidos ${money(debt+future)} para depois deste mês.`:balance-cost<m.plan?'O dinheiro que fica é menor do que planeavas guardar. Podes rever a próxima escolha.':'Ainda tens dinheiro para a tua intenção de poupança.'}</div><h3 class="subheading">O que já aconteceu</h3>${n?missionHistory():'<p class="small muted">A história começa na primeira escolha.</p>'}</section><button class="btn ghost" data-action="restart-mission">Recomeçar esta missão</button></aside></div>`;
}
function missionHistory(){return `<ol class="timeline">${state.mission.choices.map((choice,i)=>{const option=currentEvents()[i].options[choice];return `<li><strong>${cfg().period} ${i+1} · ${esc(option[0])}</strong><p>${money(option[1])} agora${option[3]?.future?' e '+money(option[3].future)+' depois':''} · ${option[2]}</p></li>`}).join('')}</ol>`}
const labs=[['orcamento','◫','Um orçamento que faz sentido','Distribui o dinheiro e testa um imprevisto.','Todos os níveis'],['poupanca','⌁','O tempo também conta','Compara três hipóteses de poupança e juros.','Todos os níveis'],['compras','🛒','A promoção compensa?','Compara quantidades, preços e portes.','Todos os níveis'],['meta','◎','Poupa para um objetivo','Planeia uma meta e regista valores fictícios por dia.','Todos os níveis'],['risco','↗','E se o valor descer?','Explora ganhos, perdas e poder de compra.','3.º ciclo · Secundário'],['credito','▤','A prestação não é tudo','Compara prazos e o custo de um empréstimo.','Secundário'],['iva','%','Impostos e escolhas coletivas','Desmonta um preço e distribui um orçamento escolar.','3.º ciclo · Secundário'],['negocio','✦','Uma ideia, muitas contas','Descobre receitas, custos e ponto de equilíbrio.','Todos os níveis']];
function laboratory(){const c=cfg();if(lab&&!c.labs.includes(lab))lab='';if(!lab)return `${title('Laboratório · '+c.name,'Experiências escolhidas para este percurso: '+c.theme.toLowerCase()+'.',c.labs.length+' experiências')}<div class="notice">${recommend()} Os valores iniciais, as tarefas e as explicações são os deste ciclo. Podes mudar os valores para experimentar.</div><div class="lab-grid">${currentLabs().map(([id,icon,h,p,level])=>`<button class="card lab-card" data-lab="${id}"><span class="lab-icon" aria-hidden="true">${icon}</span><span><h2>${h} ${state.completed.includes(id)?'<span class="badge-done" aria-label="Explorado neste percurso">✓</span>':''}</h2><p>${p}</p><span class="tag">${level}</span></span></button>`).join('')}</div>`;const info=currentLabs().find(x=>x[0]===lab);return `<button class="back" data-action="back-labs">← Experiências do ${c.name.toLowerCase()}</button>${title(info[2],info[3],c.name)}${({orcamento:budgetView,poupanca:savingsView,compras:shoppingView,meta:goalView,risco:riskView,credito:creditView,iva:taxView,negocio:businessView}[lab])()}`}
function num(id,label,value,min=0,max=100000,step='0.01',help=''){return `<div class="field"><label for="${id}">${label}</label><input id="${id}" name="${id}" type="number" min="${min}" max="${max}" step="${step}" value="${value}" required>${help?`<small>${help}</small>`:''}</div>`}
function val(id,fallback){return state.labValues[id]??cfg().defaults[id]??fallback}
function read(id){const e=$('#'+id);if(!e||!e.checkValidity())throw Error('Confere o valor de '+(e?.labels?.[0]?.textContent||id));const n=Number(e.value);if(!Number.isFinite(n))throw Error('Introduz um número válido.');return n}
function labError(s){const e=$('#lab-error');if(e){e.textContent=s;e.setAttribute('role','alert')}}
function remember(ids){for(const id of ids)state.labValues[id]=$('#'+id).value;save()}
function errorSlot(){return '<p id="lab-error" class="error-text" role="alert"></p>'}
function budgetView(){const c=cfg(),young=state.level==='primeiro';return `<div class="two-col"><section class="card"><div class="panel-title"><h2>${young?'Conta e distribui':'Planeia antes de gastar'}</h2><span class="tag green">Atualização imediata</span></div><div class="actions">${['mesada','estudante','apertado'].map((id,i)=>`<button class="btn secondary small" data-preset="${id}">${c.presetLabels[i]}</button>`).join('')}</div><form id="budget-form"><div class="fields">${num('b-income',young?'Dinheiro que tens (€)':'Rendimento disponível (€)',val('b-income',100),0,10000)}${num('b-essential',young?'Para o que precisas (€)':'Despesas necessárias (€)',val('b-essential',35),0,10000)}${num('b-leisure',young?'Para brincar e passear (€)':'Despesas de lazer (€)',val('b-leisure',20),0,10000)}${num('b-saving',young?'Para guardar (€)':'Para o objetivo (€)',val('b-saving',25),0,10000)}${young?'<input id="b-reserve" type="hidden" value="0">':num('b-reserve','Reserva para imprevistos (€)',val('b-reserve',10),0,10000)}</div><div class="field"><label for="b-shock">${young?'E se precisares de mais um material?':'E se surgir uma despesa inesperada?'}</label><select id="b-shock"><option value="0">Sem nova despesa</option><option value="${c.shock}">Material ou reparação: +${c.shock} €</option><option value="${c.shock*2}">Imprevisto maior: +${c.shock*2} €</option></select><small>${young?'Conta também este gasto.':'O imprevisto é uma despesa adicional. Podes utilizar a reserva, reduzindo o montante que planeavas manter nela.'}</small></div>${errorSlot()}<button class="btn">Guardar esta experiência</button></form></section><section class="card" id="budget-result" aria-live="polite"></section></div>`}
function calcBudget(record=false){try{const ids=['b-income','b-essential','b-leisure','b-saving','b-reserve'],ns=ids.map(read),shock=read('b-shock'),r=Finance.budget(...ns,shock),young=state.level==='primeiro';labError('');$('#budget-result').innerHTML=`<h2>${young?'Vamos ver as contas':'Para onde vai o dinheiro?'}</h2><p class="lead">${young?'Dinheiro que tens':'Rendimento'}: ${money(ns[0])}</p><div class="stats" style="margin-top:20px"><div class="stat"><span class="label">${young?'Para usar':'Despesas totais'}</span><strong>${money(r.spend)}</strong></div><div class="stat purple"><span class="label">Para guardar</span><strong>${money(ns[3]+ns[4])}</strong></div><div class="stat"><span class="label">${r.free<0?'Falta':'Livre'}</span><strong>${money(Math.abs(r.free))}</strong></div></div><div class="bar" role="img" aria-label="Distribuição do orçamento de ${money(ns[0])}; despesas ${money(r.spend)}, poupança e reserva ${money(ns[3]+ns[4])}, livre ${money(r.free)}">${[ns[1]+shock,ns[2],ns[3],ns[4],Math.max(0,r.free)].map((v,i)=>`<span style="width:${v/Math.max(1,r.allocated,ns[0])*100}%;background:${['var(--purple)','#b6a7e1','#67b795','#9bd6bd','#e1e4ed'][i]}"></span>`).join('')}</div><div class="legend"><span>Necessidades</span><span>Lazer</span><span>Objetivo${young?'':' e reserva'}</span><span>Livre</span></div>${moneyCoins(Math.max(0,r.free))}<div class="notice ${r.free<0?'error':'green'}">${r.free<0?`Queres distribuir ${money(r.allocated)}, mas só tens ${money(ns[0])}. Faltam ${money(-r.free)}. Revê uma escolha.`:r.free===0?'Todo o dinheiro tem um lugar no plano. Uma nova despesa pede uma nova distribuição.':`Depois de usar e guardar o que planeaste, ficam ${money(r.free)} livres.`}</div><h3>${young?'A conta, passo a passo':'Uma pergunta para testar o plano'}</h3><p class="lead">${young?`${money(ns[0])} − ${money(ns[1]+shock)} para necessidades − ${money(ns[2])} para brincar − ${money(ns[3])} para guardar = ${money(r.free)}.`:budgetQuestion()}</p><div class="notice">${young?'O dinheiro guardado continua a ser teu. Não pode ser contado outra vez como dinheiro livre.':shock?'Se usares a reserva para pagar o imprevisto, reduz essa rubrica no plano. O mesmo euro não pode financiar duas finalidades ao mesmo tempo.':'O dinheiro do objetivo e da reserva continua a ser teu, mas já tem uma finalidade no orçamento.'}</div>`;if(record){remember([...ids,'b-shock']);complete('orcamento');announce('Experiência guardada neste percurso.')}}catch(e){labError(e.message);$('#budget-result').innerHTML='<div class="notice error">Confere os números para veres uma conta válida.</div>'}}
function savingsView(){const c=cfg(),simple=['primeiro','segundo'].includes(state.level);return `<div class="two-col"><section class="card"><h2>${simple?'Quanto achas que vais juntar?':'Antes de calcular, prevê'}</h2><p class="lead">${c.savingPrompt}</p><form id="savings-form"><div class="fields">${num('s-initial',simple?'Dinheiro já guardado (€)':'Valor inicial (€)',val('s-initial',100),0,100000)}${num('s-monthly','Guardar por '+c.savingPeriod+' (€)',val('s-monthly',10),0,10000)}${num('s-months','Quantas '+c.savingPlural+'?',val('s-months',24),1,simple?60:600,1)}${simple?'<input id="s-rate" type="hidden" value="0">':num('s-rate','Taxa anual efetiva hipotética (%)',val('s-rate',3),0,15,'0.1')}</div><div class="field"><label for="s-prediction">A minha previsão, em euros (opcional)</label><input id="s-prediction" type="number" min="0" max="1000000000" step="0.01" inputmode="decimal" placeholder="Quanto achas que haverá no final?"></div>${errorSlot()}<button class="btn">${simple?'Ver e comparar as contas':'Comparar três hipóteses'} →</button></form><p class="metric-note">${simple?'Dinheiro fictício, sem juros. Somamos o valor guardado no fim de cada '+c.savingPeriod+'.':'Entregas no final de cada mês. Capitalização mensal equivalente à taxa anual efetiva. Sem impostos, custos, inflação ou levantamentos; taxas fictícias e constantes.'}</p></section><section class="card" id="savings-result"><div class="empty">Faz uma previsão. Depois experimenta guardar o dobro e compara.</div></section></div>`}
function calcSavings(){try{const ids=['s-initial','s-monthly','s-months','s-rate'],[initial,monthly,months,rate]=ids.map(read),simple=['primeiro','segundo'].includes(state.level),c=cfg(),r=Finance.savings(initial,monthly,months,simple?0:rate),prediction=$('#s-prediction').value;remember(ids);complete('poupanca');const rows=simple?[['O teu plano',r.value],['Guardar o dobro por '+c.savingPeriod,initial+monthly*2*months],['Guardar durante o dobro do tempo',initial+monthly*months*2]]:[['Sem juros',Finance.savings(initial,monthly,months,0).value],['A tua hipótese: '+formatNum(rate)+'%',r.value],['Taxa alternativa: '+formatNum(rate+1)+'%',Finance.savings(initial,monthly,months,rate+1).value]];$('#savings-result').innerHTML=`<h2>${simple?'O que fica guardado':'O plano ao longo do tempo'}</h2><div class="stats" style="margin-top:20px"><div class="stat"><span class="label">Valor inicial</span><strong>${money(initial)}</strong></div><div class="stat"><span class="label">Novas entregas</span><strong>${money(monthly*months)}</strong></div><div class="stat purple"><span class="label">No final</span><strong>${money(r.value)}</strong></div></div>${simple?`<div class="notice green">${money(initial)} + (${months} × ${money(monthly)}) = <strong>${money(r.value)}</strong>.</div>${moneyCoins(r.value)}`:lineChart(r.series,Array.from({length:months+1},(_,i)=>initial+monthly*i))}<div class="table-wrap"><table><caption class="sr-only">Comparação de três planos</caption><thead><tr><th>Plano</th><th>Total</th></tr></thead><tbody>${rows.map(([label,total])=>`<tr><td>${label}</td><td><strong>${money(total)}</strong></td></tr>`).join('')}</tbody></table></div><div class="notice">${prediction!==''?`Previste ${money(Number(prediction))}. A diferença para o teu plano é ${money(Math.abs(Number(prediction)-r.value))}.<br>`:''}${simple?'Guardar com regularidade aproxima-te da meta. Um prazo maior e uma entrega maior mudam o total.':`Colocaste ${money(r.paid)} e os juros calculados são ${money(r.gain)}. Os juros acumulados também podem gerar juros. Não se trata de uma oferta nem de uma previsão.`}</div><p class="small muted">${simple?'Consegues explicar por que razão duplicar a entrega não duplica o dinheiro que já tinhas no início?':state.level==='terceiro'?'O que muda se duplicares o prazo? Faz a previsão e verifica o efeito dos juros.':'Como alterariam os custos, os impostos e a inflação a interpretação deste resultado?'}</p>`;labError('');announce('Planos de poupança comparados.')}catch(e){labError(e.message)}}
function lineChart(series,comparison=null){const all=comparison?[...series,...comparison]:series,min=Math.min(0,...all),max=Math.max(1,...all),plot=a=>a.map((v,i)=>`${25+i/(a.length-1||1)*450},${155-(v-min)/(max-min)*130}`).join(' ');return `<svg class="mini-line" viewBox="0 0 500 180" role="img" aria-label="Evolução do total: começa em ${money(series[0])} e termina em ${money(series.at(-1))}. ${comparison?'Dinheiro colocado no final: '+money(comparison.at(-1)):''}"><path d="M25 25H475M25 90H475M25 155H475" stroke="#e8e8f0" fill="none"/>${comparison?`<polyline points="${plot(comparison)}" fill="none" stroke="#67b795" stroke-width="2.5" stroke-dasharray="5 5"/>`:''}<polyline points="${plot(series)}" fill="none" stroke="#6752c9" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/><text x="25" y="176" font-size="11" fill="#60677d">Início</text><text x="475" y="176" text-anchor="end" font-size="11" fill="#60677d">Fim</text></svg>`}
function riskView(){const senior=state.level==='secundario';return `<div class="two-col"><section class="card"><h2>${senior?'Três cenários depois dos custos':'O mesmo dinheiro, três resultados'}</h2><p class="lead">${senior?'Analisa prazo, custo anual e inflação em conjunto. Um resultado calculado não é uma previsão.':'Um investimento pode ganhar ou perder valor. Compara hipóteses antes de pensar num ganho.'}</p><form id="risk-form"><div class="fields">${num('r-capital','Capital fictício (€)',val('r-capital',500),1,100000)}${num('r-years','Prazo (anos)',val('r-years',1),1,30,1)}${num('r-inflation','Inflação anual hipotética (%)',val('r-inflation',2),0,20,'0.1')}${senior?num('r-cost','Custo anual sobre o valor (%)',val('r-cost',0.5),0,10,'0.1'):'<input id="r-cost" type="hidden" value="0">'}</div>${errorSlot()}<button class="btn">Explorar ganhos e perdas</button></form><div class="notice">Uma perda de 20% transforma 100 € em 80 €. Para voltar a 100 €, é necessário ganhar 25% sobre os 80 €.</div><p class="metric-note">Hipóteses constantes de −10%, +2% e +8% anuais; reinvestimento anual; sem reforços ou impostos. ${senior?'O custo percentual é retirado ao valor no fim de cada ano.':'Neste exercício não se incluem custos.'} Sem probabilidades atribuídas.</p></section><section class="card" id="risk-result"><div class="empty">Faz uma previsão. Depois verifica se o capital e o poder de compra aumentam ou diminuem.</div></section></div>`}
function calcRisk(){try{const ids=['r-capital','r-years','r-inflation','r-cost'],[p,y,inf,cost]=ids.map(read);remember(ids);complete('risco');$('#risk-result').innerHTML=`<h2>No fim de ${y} ${y===1?'ano':'anos'}</h2><div class="table-wrap"><table><caption class="metric-note">Cenários calculados, sem garantias ou probabilidades.</caption><thead><tr><th>Hipótese anual bruta</th><th>Valor ${cost?'após custos':'nominal'}</th><th>Poder de compra*</th></tr></thead><tbody>${[-10,2,8].map(rate=>{const nominal=Finance.risk(p,y,rate,cost),real=nominal/Math.pow(1+inf/100,y);return `<tr><td>${rate>0?'+':''}${formatNum(rate)}%</td><td>${money(nominal)}</td><td>${money(real)}</td></tr>`}).join('')}</tbody></table></div><p class="metric-note">* Em euros com o poder de compra do início. Inflação: ${formatNum(inf)}% por ano. ${cost?'Custo: '+formatNum(cost)+'% por ano.':''}</p><div class="notice peach">O resultado pode ficar abaixo dos ${money(p)} iniciais. As perdas reais podem ser superiores às hipóteses apresentadas, incluindo a perda total em certos produtos. Um prazo maior não garante lucro.</div><h3>Que informação falta?</h3><p class="lead">${state.level==='secundario'?'Custos concretos, impostos, condições de saída, riscos do produto e capacidade para suportar perdas. Testa o mesmo cenário com um custo anual maior.':'Quando precisas deste dinheiro? Podes perder parte dele? Conheces a entidade e os custos?'}</p><p class="small muted">Diversificar pode reduzir a exposição a um único ativo; não elimina todos os riscos.</p>`;labError('')}catch(e){labError(e.message)}}
function shoppingView(){const c=cfg(),young=state.level==='primeiro',second=state.level==='segundo',units=c.unit;return `<div class="two-col"><section class="card"><h2>${young?'Vamos comprar lápis?':'Qual é o custo da quantidade necessária?'}</h2><p class="lead">${c.shopping}</p><form id="shopping-form">${num('c-need','Quantidade necessária ('+units+')',val('c-need',2),units==='litros'?0.1:1,100,units==='litros'?'0.1':'1')}<div class="fields">${num('c-a-price','A · preço da embalagem (€)',val('c-a-price',2.4),0.01,1000)}${num('c-a-volume','A · '+units+' por embalagem',val('c-a-volume',1),units==='litros'?0.1:1,100,units==='litros'?'0.1':'1')}${num('c-b-price','B · preço da embalagem (€)',val('c-b-price',6.9),0.01,1000)}${num('c-b-volume','B · '+units+' por embalagem',val('c-b-volume',3),units==='litros'?0.1:1,100,units==='litros'?'0.1':'1')}</div>${young||second?'<input id="c-delivery" type="hidden" value="0">':num('c-delivery','B · portes por encomenda (€)',val('c-delivery',1.5),0,1000)}${errorSlot()}<button class="btn">${young?'Contar quanto pago':'Comparar o custo real'}</button></form></section><section class="card" id="shopping-result"><div class="notice">${c.shoppingTip}</div></section></div>`}
function calcShopping(){try{const ids=['c-need','c-a-price','c-a-volume','c-b-price','c-b-volume','c-delivery'],[need,ap,av,bp,bv,delivery]=ids.map(read),a=Finance.buy(ap,av,need),b=Finance.buy(bp,bv,need,delivery),young=state.level==='primeiro',c=cfg();remember(ids);complete('compras');$('#shopping-result').innerHTML=`<h2>${young?'O que compro, o que pago':'Preço por unidade e total da compra'}</h2><div class="table-wrap"><table><thead><tr><th></th><th>Opção A</th><th>Opção B</th></tr></thead><tbody>${young?'':`<tr><th>Por ${c.unit==='litros'?'litro':'unidade'}, sem portes</th><td>${money(a.unit)}</td><td>${money(b.unit)}</td></tr>`}<tr><th>Embalagens a comprar</th><td>${a.packs}</td><td>${b.packs}</td></tr><tr><th>Total a pagar</th><td><strong>${money(a.total)}</strong></td><td><strong>${money(b.total)}</strong></td></tr><tr><th>${c.unit} a mais</th><td>${formatNum(Finance.round(a.excess))}</td><td>${formatNum(Finance.round(b.excess))}</td></tr></tbody></table></div><div class="notice green">${Math.abs(a.total-b.total)<.005?'As opções custam o mesmo.':`A opção ${a.total<b.total?'A':'B'} custa menos ${money(Math.abs(a.total-b.total))}.`} ${young?'Conta os lápis de que precisas e os que ficam a mais.':'O total inclui as embalagens inteiras necessárias e os portes indicados.'}</div><h3>${young?'E se precisasses de mais lápis?':'A decisão muda com a quantidade?'}</h3><p class="lead">${young?'Muda a quantidade e volta a contar.':'Altera só a quantidade necessária. Que opção passa a compensar? Como utilizarias o excedente?'}</p>`;labError('')}catch(e){labError(e.message)}}
function creditView(){return `<div class="two-col"><section class="card"><h2>Uma prestação mais baixa chega?</h2><p class="lead">Compara um prazo com outro duas vezes maior. O crédito é um compromisso futuro, não um rendimento.</p><form id="credit-form"><div class="fields">${num('k-capital','Montante emprestado (€)',val('k-capital',600),1,100000)}${num('k-rate','TAN hipotética (%)',val('k-rate',12),0,50,'0.1')}${num('k-months','Prazo A (meses)',val('k-months',12),1,180,1)}${num('k-fees','Encargo inicial fixo (€)',val('k-fees',20),0,10000)}</div>${errorSlot()}<button class="btn">Comparar os dois prazos</button></form><p class="metric-note">Prestações mensais constantes; taxa mensal = TAN/12; sem carência. O encargo inicial é pago à parte, não financiado. Excluem-se impostos, seguros e outros custos. Os totais usam prestações sem arredondamento intermédio.</p></section><section class="card" id="credit-result"><div class="empty">Experimenta também uma TAN de 0%. Um crédito sem juros pode continuar a ter encargos.</div></section></div><div class="notice"><strong>TAN</strong>: taxa usada para os juros. <strong>TAEG</strong>: medida anual do custo global, incluindo outros encargos previstos. <strong>MTIC</strong>: total a pagar pelo crédito. Na vida real, compara TAEG e MTIC de propostas comparáveis e lê a informação pré-contratual. Este simulador não calcula a TAEG.</div>`}
function calcCredit(){try{const ids=['k-capital','k-rate','k-months','k-fees'],[p,rate,months,fees]=ids.map(read),a=Finance.credit(p,rate,months,fees),b=Finance.credit(p,rate,months*2,fees);remember(ids);complete('credito');$('#credit-result').innerHTML=`<h2>Menos por mês, mais no total?</h2><div class="table-wrap"><table><thead><tr><th></th><th>A · ${months} meses</th><th>B · ${months*2} meses</th></tr></thead><tbody><tr><th>Prestação mensal</th><td>${money(a.payment)}</td><td>${money(b.payment)}</td></tr><tr><th>Juros</th><td>${money(a.interest)}</td><td>${money(b.interest)}</td></tr><tr><th>Encargo inicial</th><td>${money(fees)}</td><td>${money(fees)}</td></tr><tr><th>Total simulado</th><td><strong>${money(a.total)}</strong></td><td><strong>${money(b.total)}</strong></td></tr></tbody></table></div><div class="notice peach">${rate===0?`Com TAN de 0%, os juros são nulos, mas o encargo inicial mantém-se: ${money(fees)}.`:`O prazo B reduz a prestação em ${money(a.payment-b.payment)}, mas aumenta o custo total em ${money(b.total-a.total)}.`}</div><p class="lead">Que parte de um rendimento mensal ficaria comprometida? O que aconteceria perante uma quebra de rendimento?</p>`;labError('')}catch(e){labError(e.message)}}
function taxView(){const c=cfg(),second=state.level==='segundo';return `<div class="two-col">${second?`<section class="card"><div class="eyebrow">UMA DECISÃO DA TURMA</div><h2>O que fazemos com ${money(c.school)}?</h2><p class="lead">A escola tem este valor fictício para três propostas. Podes distribuir o dinheiro por livros, desporto e acessibilidade.</p><div class="notice">Cada escolha deve ter uma razão. Ouve as necessidades dos colegas. Não há uma única distribuição correta.</div><p class="lead">Se deres mais 20 € aos livros, de onde podem vir esses 20 €?</p></section>`:`<section class="card"><h2>O imposto dentro de um preço</h2><p class="lead">Usa uma taxa fictícia do exercício. ${state.level==='terceiro'?'Começa por adicionar o imposto a uma base.':'Compara adicionar o imposto com extrair o imposto que já está incluído.'}</p><form id="tax-form"><div class="fields">${num('t-price','Preço do exercício (€)',val('t-price',120),0,100000)}${num('t-rate','Taxa do exercício (%)',val('t-rate',20),0,100,'0.1')}</div><div class="field"><label for="t-mode">O preço introduzido…</label><select id="t-mode"><option value="excluded" ${state.level==='terceiro'?'selected':''}>Ainda não inclui o imposto</option><option value="included" ${state.level==='secundario'?'selected':''}>Já inclui o imposto</option></select></div>${errorSlot()}<button class="btn">Desmontar o preço</button></form><div id="tax-result"></div><p class="metric-note">As taxas são fictícias. As regras reais dependem do bem ou serviço e da região; consulta a Autoridade Tributária.</p></section>`}<section class="card"><h2>${second?'A tua proposta para a turma':'Um orçamento participativo'}</h2><p class="lead">Distribui ${money(c.school)} fictícios. Uma verba maior para uma proposta reduz a margem para as outras.</p><form id="school-form">${num('t-books','Livros e leitura (€)',val('t-books',400),0,c.school,10)}${num('t-sport','Atividades desportivas (€)',val('t-sport',300),0,c.school,10)}${num('t-access','Acessibilidade e inclusão (€)',val('t-access',300),0,c.school,10)}<button class="btn secondary">Avaliar a distribuição</button></form><div id="school-result" aria-live="polite"></div><p class="metric-note">${second?'Um orçamento comum pede escolhas e explicações.':'Os impostos financiam serviços através dos orçamentos públicos; o exercício não liga diretamente o imposto desta compra à escola.'}</p></section></div>`}
function calcTax(){try{const ids=['t-price','t-rate'],[p,rate]=ids.map(read),included=$('#t-mode').value==='included',r=Finance.vat(p,rate,included);remember(ids);complete('iva');$('#tax-result').innerHTML=`<div class="notice green" role="status">Base: <strong>${money(r.net)}</strong><br>Imposto: <strong>${money(r.tax)}</strong><br>Total: <strong>${money(r.total)}</strong></div><p class="small muted">${included?'Base = preço total ÷ (1 + taxa/100). O imposto incluído não se obtém multiplicando diretamente o total pela taxa.':'Imposto = base × taxa/100. Total = base + imposto.'}</p>`;labError('')}catch(e){labError(e.message)}}
function businessView(){const young=state.level==='primeiro',senior=state.level==='secundario';return `<div class="two-col"><section class="card"><h2>${young?'Cartões feitos pela turma':senior?'Um lote de t-shirts para um evento':'Uma banca na feira da escola'}</h2><p class="lead">${young?'Vais fazer e vender seis cartões. Conta o que recebes e o que gastas em material.':senior?'Produzir e vender são decisões diferentes. Testa o resultado quando uma parte do lote fica por vender.':'A equipa prepara marcadores. Conta o custo de preparar a banca e o custo de cada unidade.'}</p><form id="business-form"><div class="fields">${num('n-price','Preço de venda por unidade (€)',val('n-price',3),0,1000)}${num('n-unit','Material por unidade (€)',val('n-unit',1.2),0,1000)}${young?'<input id="n-fixed" type="hidden" value="0">':num('n-fixed','Custos fixos (€)',val('n-fixed',15),0,100000)}${senior?num('n-produced','Unidades produzidas',val('n-produced',60),0,10000,1):''}${num('n-quantity',senior?'Unidades vendidas':'Unidades feitas e vendidas',val('n-quantity',40),0,10000,1)}</div>${errorSlot()}<button class="btn">Fazer as contas</button></form><p class="metric-note">${senior?'O material é pago para todo o lote, incluindo as unidades por vender.':'Neste exercício, todas as unidades feitas são vendidas.'} Sem impostos, remuneração do trabalho ou outros encargos.</p></section><section class="card" id="business-result"><div class="notice">${young?'O dinheiro que recebes não é todo para guardar: primeiro pagas o material.':senior?'Se só venderes parte do lote, a receita desce, mas os custos do material produzido mantêm-se.':'Receita não é lucro. É preciso subtrair os custos.'}</div></section></div>`}
function calcBusiness(){try{const ids=['n-price','n-unit','n-fixed','n-quantity'],[p,c,f,q]=ids.map(read),young=state.level==='primeiro',senior=state.level==='secundario',produced=senior?read('n-produced'):q;if(q>produced)throw Error('As unidades vendidas não podem superar as unidades produzidas.');const r=senior?Finance.stockBusiness(p,c,f,produced,q):Finance.business(p,c,f,q);remember(senior?[...ids,'n-produced']:ids);complete('negocio');$('#business-result').innerHTML=`<h2>${young?'Quanto posso guardar?':'O resultado da atividade'}</h2><div class="stats" style="margin-top:20px"><div class="stat"><span class="label">${young?'Recebo':'Receita'}</span><strong>${money(r.revenue)}</strong></div><div class="stat"><span class="label">${young?'Gasto':'Custos'}</span><strong>${money(r.cost)}</strong></div><div class="stat purple"><span class="label">${r.profit<0?'Prejuízo':young?'Sobra':'Resultado'}</span><strong>${money(r.profit)}</strong></div></div><div class="notice ${r.profit<0?'peach':'green'}">${young?`${q} × ${money(p)} = ${money(r.revenue)} nas vendas.<br>${q} × ${money(c)} = ${money(r.cost)} em material.<br>${money(r.revenue)} − ${money(r.cost)} = ${money(r.profit)}.`:senior?`Produziste ${produced} e vendeste ${q}. Ficam ${produced-q} unidades em stock. ${r.breakEven===null?'Sem preço de venda positivo, não consegues pagar o lote com vendas.':`Ao preço indicado, precisas de vender ${r.breakEven} unidades para pagar os custos deste lote${r.breakEven>produced?' — mais do que as unidades disponíveis':''}.`}`:r.breakEven===null?'O preço não supera o custo por unidade. Vender mais não cria margem positiva.':`Precisas de vender pelo menos ${r.breakEven} unidades para cobrir os custos deste modelo.`}</div>${moneyCoins(Math.max(0,r.profit))}<h3>${young?'E se fizeres só três cartões?':senior?'E se venderes todo o lote?':'E se venderes menos?'}</h3><p class="lead">${young?'Muda a quantidade. O que acontece ao material e ao dinheiro que sobra?':senior?'Mantém a produção e muda apenas as vendas. Depois testa o preço. Que risco corres se produzires sem conhecer a procura?':'Altera a quantidade. Neste modelo, produzir menos também reduz o custo de material.'}</p>`;labError('')}catch(e){labError(e.message)}}
function goalView(){const g=state.goal;if(!g){const today=Finance.date(),d=new Date(today+'T12:00:00');d.setDate(d.getDate()+cfg().goal.days);const end=[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');return `<div class="two-col"><section class="card"><h2>Transforma uma vontade num plano</h2><form id="goal-start"><div class="field"><label for="g-name">Nome da meta fictícia</label><input id="g-name" value="${esc(cfg().goal.name)}" required maxlength="80" autocomplete="off"></div><div class="fields">${num('g-target','Meta total (€)',cfg().goal.target,0.01,100000)}${num('g-initial','Já poupado (€)',cfg().goal.initial,0,100000)}</div><div class="field"><label for="g-deadline">Data limite</label><input id="g-deadline" type="date" min="${today}" max="2036-12-31" value="${end}" required></div>${errorSlot()}<button class="btn">Criar o meu plano</button></form></section><aside class="card"><h3>Uma meta é mais do que um número</h3><p class="lead">Define o valor, o prazo e o ponto de partida. Depois revê o plano quando algo mudar.</p><div class="notice">Usa apenas dados inventados. Não precisas de identificar o aluno nem de introduzir informações da tua família.</div><p class="small muted">O registo é diário. Se corrigires o mesmo dia, o valor anterior é substituído; não é somado outra vez.</p></aside></div>`}
const r=Finance.goal(g.target,g.initial,g.entries),today=Finance.date(),left=Math.max(0,Finance.days(today,g.deadline)),elapsed=Math.max(0,Finance.days(g.start,today));return `<div class="two-col"><section class="card"><div class="panel-title"><h2>${esc(g.name)}</h2><span class="tag green">${state.level==='primeiro'?money(r.total)+' de '+money(g.target):r.percent.toFixed(0)+'%'}</span></div><div class="stats"><div class="stat purple"><span class="label">Guardado</span><strong>${money(r.total)}</strong></div><div class="stat"><span class="label">Meta</span><strong>${money(g.target)}</strong></div><div class="stat"><span class="label">Dias restantes</span><strong>${left}</strong></div></div><div class="bar" role="progressbar" aria-label="Progresso da meta" aria-valuenow="${r.percent.toFixed(0)}" aria-valuemin="0" aria-valuemax="100"><span style="width:${r.percent}%;background:var(--purple)"></span></div><div class="notice ${r.remaining===0?'green':left===0?'peach':''}">${r.remaining===0?'Atingiste a meta fictícia. Que hábito te ajudou?':left===0?'Chegaste à data limite com '+money(r.remaining)+' por guardar. Podes criar um novo plano e discutir o prazo.':state.level==='primeiro'?`Falta guardar ${money(r.remaining)} e tens ${left} dias até à data limite. Em que dia queres guardar esse dinheiro?`:`Faltam ${money(r.remaining)}. Como referência, cerca de ${money(r.remaining/(left+1))} por dia, contando hoje e a data limite.`}</div><p class="small muted">Início: ${formatDate(g.start)} · Limite: ${formatDate(g.deadline)} · ${elapsed} dias decorridos.</p><h3 class="subheading">Registos diários</h3>${Object.keys(g.entries).length?`<div class="table-wrap"><table><thead><tr><th>Dia</th><th>Poupança</th></tr></thead><tbody>${Object.entries(g.entries).sort(([a],[b])=>b.localeCompare(a)).slice(0,31).map(([day,amount])=>`<tr><td>${formatDate(day)}</td><td>${money(amount)}</td></tr>`).join('')}</tbody></table></div><p class="metric-note">Últimos 31 dias registados. O relatório inclui todos.</p>`:'<p class="small muted">Ainda não há registos. O valor inicial é '+money(g.initial)+'.</p>'}<button class="text-button" data-action="reset-goal">Criar outra meta</button></section><section class="card"><h2>Registar ou corrigir um dia</h2><p class="lead">Um dia tem um único valor. Podes escrever 0 para remover o seu contributo.</p><form id="goal-record"><div class="field"><label for="g-day">Dia do registo</label><input id="g-day" type="date" min="${g.start}" max="${today<g.deadline?today:g.deadline}" value="${today<=g.deadline?today:g.deadline}" required></div>${num('g-amount','Valor fictício poupado nesse dia (€)',g.entries[today<=g.deadline?today:g.deadline]||0,0,100000)}${errorSlot()}<button class="btn">Guardar o valor deste dia</button></form><div class="notice">Editar 5 € para 7 € no mesmo dia aumenta o total apenas em 2 €. Todos os valores ficam neste navegador.</div><button class="btn secondary" data-go="progresso">Levar os registos para o relatório</button></section></div>`}

['Um cartão de débito e um cartão de crédito funcionam sempre da mesma forma?',['Sim, ambos oferecem dinheiro.','Não. No crédito usas um limite emprestado, que tens de reembolsar.','Sim, nenhum pode ter custos.'],1,'O débito movimenta fundos da conta, podendo existir condições de descoberto. No crédito há um empréstimo a reembolsar e podem existir juros e encargos.'],

function quiz(){if(!quizSession)return `${title('Seis escolhas. Seis descobertas.','O feedback explica o raciocínio. Avança quando estiveres pronto.','Desafio · 8 min')}<div class="two-col"><section class="card"><div class="eyebrow">PERGUNTAR TAMBÉM É APRENDER</div><h2>O que farias nesta situação?</h2><p class="lead">Seis perguntas para ${levelName(state.level).toLowerCase()}. Uma resposta de cada vez, com explicação e oportunidade de voltar a tentar.</p><div class="notice">O resultado regista as respostas certas à primeira tentativa. As novas tentativas servem para aprender e não alteram esse resultado.</div><button class="btn" data-action="start-quiz">Começar os seis desafios →</button></section><aside class="card"><h3>Mais do que acertar</h3><ul class="list"><li>Lê a situação com atenção.</li><li>Escolhe e lê a explicação.</li><li>Se precisares, volta a tentar.</li><li>Relaciona a ideia com outra situação.</li></ul>${state.quiz?`<div class="notice green">Último percurso: ${state.quiz.score}/6 à primeira tentativa · ${levelName(state.quiz.level)}.</div>`:''}</aside></div>`;
const q=quizSession,bank=questionBanks[q.level];if(q.index===6)return `${title('Agora, explica com as tuas palavras.','Acertar é um passo. Transferir a aprendizagem é o seguinte.','Desafio concluído')}<section class="card quiz-width"><div class="result-hero"><div class="result-icon" aria-hidden="true">✧</div><h2>${q.score} de 6 à primeira tentativa</h2><p>Experimentaste seis situações. Podes rever cada explicação e voltar ao desafio quando quiseres.</p></div><div class="field"><label for="quiz-reflection">Que conselho darias a um colega antes de uma compra ou de um empréstimo?</label><textarea id="quiz-reflection" maxlength="1500" placeholder="Antes de decidir, eu verificaria…">${esc(state.quiz?.reflection||'')}</textarea></div><div class="actions"><button class="btn" data-go="progresso">Ver o meu percurso</button><button class="btn secondary" data-action="start-quiz">Voltar a praticar</button></div><h3 class="subheading">Rever as seis ideias</h3>${bank.map(([question,options,answer,explanation],i)=>`<details class="definition"><summary>${i+1}. ${question}</summary><p><strong>${options[answer]}</strong></p><p>${explanation}</p></details>`).join('')}</section>`;
const [question,options,answer,explanation]=bank[q.index],answered=q.selected!==null,correct=q.selected===answer;return `${title('Põe as ideias à prova',levelName(q.level)+' · Podes retomar esta tentativa neste navegador, mesmo depois de mudares de ciclo.','Pergunta '+(q.index+1)+' de 6')}<section class="card quiz-width"><div class="steps" aria-label="${q.index} de 6 perguntas concluídas">${bank.map((x,i)=>`<span class="step ${i<q.index?'done':''}"></span>`).join('')}</div><div class="eyebrow">DECIDIR COM INFORMAÇÃO</div><h2 class="question-title">${question}</h2>${options.map((o,i)=>`<button class="choice ${answered&&i===q.selected?(correct?'correct':'wrong'):''}" data-answer="${i}" ${answered?'disabled':''}><span class="circle">${'ABC'[i]}</span><strong>${o}</strong></button>`).join('')}${answered?`<div class="notice ${correct?'green':'peach'}" role="status"><strong>${correct?'Essa escolha faz sentido.':'Vamos olhar para o raciocínio.'}</strong><br>${explanation}</div><div class="actions">${!correct?'<button class="btn secondary" data-action="retry-question">Tentar esta pergunta de novo</button>':''}<button class="btn" data-action="next-question">${q.index===5?'Terminar e refletir':'Próxima pergunta'} →</button></div>`:'<p class="metric-note">A explicação fica visível até decidires avançar.</p>'}</section>`}
const definitions=[['Necessidade ou desejo?','Uma necessidade é algo essencial no contexto da pessoa. Um desejo pode dar prazer sem ser indispensável. A classificação depende da situação.','Um telemóvel pode servir uma necessidade de comunicação; escolher o modelo mais caro pode acrescentar um desejo.'],['Orçamento e saldo','Um orçamento antecipa receitas e despesas. Um saldo negativo pede a revisão das escolhas. Poupar é guardar recursos para mais tarde.','Receber 60 €, gastar 35 € e guardar 20 € deixa 5 € por distribuir.'],['Fundo de emergência','É uma reserva para despesas imprevistas ou quebras de rendimento. Ajuda a evitar depender de crédito numa urgência.','Uma reparação inesperada pode obrigar a usar a reserva e a voltar a constituí-la depois.'],['Juros e capitalização','Os juros podem remunerar uma poupança ou ser um custo de um empréstimo. Com capitalização, os juros acumulados entram nos cálculos seguintes.','100 € a 3% ao ano, com capitalização anual e sem custos, tornam-se 103 € ao fim de um ano e 106,09 € ao fim de dois.'],['Débito, crédito e segurança','No débito movimentas a conta; no crédito utilizas dinheiro emprestado, sujeito a reembolso e às condições contratadas. Nunca partilhes PIN, palavras-passe ou códigos.','Uma ligação com um logótipo conhecido pode ser falsa. Confirma pelo sítio ou aplicação oficial, sem seguir a ligação suspeita.'],['Risco, liquidez e inflação','Risco inclui poder perder dinheiro. Liquidez é a facilidade de dispor dele. A inflação reduz o poder de compra quando os preços sobem.','Um montante pode crescer em euros e, ainda assim, comprar menos do que antes se os preços crescerem mais.'],['Crédito: TAN, TAEG e MTIC','A TAN mede a taxa nominal dos juros. A TAEG traduz o custo global anual do crédito nos termos aplicáveis. O MTIC é o valor total a pagar.','Uma prestação menor durante mais meses pode levar a um total maior. Compara propostas equivalentes e todas as condições.'],['Impostos e cidadania','Os impostos contribuem para financiar serviços e políticas públicas. As escolhas coletivas também exigem prioridades e prestação de contas.','Distribuir um orçamento por livros, desporto e acessibilidade implica discutir necessidades e custos de oportunidade.'],['Receita, custo e resultado','Receita é o valor das vendas. O resultado obtém-se subtraindo os custos. O ponto de equilíbrio indica as vendas necessárias para cobrir os custos do modelo.','100 € de vendas e 70 € de custos deixam um resultado de 30 €, antes de outros encargos.']];
function learn(){const c=cfg(),young=['primeiro','segundo'].includes(state.level),lessons=c.lessons||(state.level==='terceiro'?definitions.filter((x,i)=>i!==6):[...definitions,['Compromissos futuros e liquidez','Uma prestação paga hoje pode criar obrigações para vários meses. Dinheiro na conta não é o mesmo que dinheiro livre.','Uma compra de 5 × 40 € custa 200 €. Depois de pagar 40 €, ainda tens 160 € por pagar.'],['Produção, vendas e stock','Produzir uma unidade tem custo, mesmo quando ela ainda não foi vendida. A procura incerta afeta a viabilidade do projeto.','Produzes 60 t-shirts a 7 € e pagas 80 € fixos: o lote custa 500 €. Vender 40 a 12 € gera 480 € e um prejuízo de 20 €.']]);return `${title('Aprender · '+c.name,c.theme,'Explicações e exemplos deste percurso')}<div class="two-col"><section><h2 style="margin-bottom:17px">${young?'Uma ideia, um exemplo':'Conceitos para fundamentar escolhas'}</h2>${lessons.map(([h,p,e])=>`<details class="definition"><summary>${h}</summary><p>${p}</p><p class="example"><strong>Um exemplo:</strong> ${e}</p></details>`).join('')}<div class="notice green"><strong>Agora experimenta:</strong> ${c.transfer}</div></section><aside class="stack"><section class="card"><div class="eyebrow">GUIA PARA A AULA · ${c.name.toUpperCase()}</div><h2>Prever → experimentar → explicar</h2><p class="lead">${c.guide}</p><ol class="list"><li><strong>5 min:</strong> conversar sobre ${c.objectives[0].toLowerCase()}.</li><li><strong>12 min:</strong> completar «${c.missionTitle}».</li><li><strong>12 min:</strong> explorar uma das ${c.labs.length} experiências deste ciclo.</li><li><strong>8 min:</strong> responder aos seis desafios.</li><li><strong>8 min:</strong> comparar explicações e guardar o relatório.</li></ol><div class="notice">${c.transfer}</div><p class="small muted">O ciclo orienta a dificuldade; o professor pode escolher outro percurso para apoiar ou aprofundar a aprendizagem. Os resultados não constituem uma classificação automática.</p></section><section class="card"><h2>Quatro percursos diferentes</h2><div class="source-list" style="margin-top:16px">${LEVELS.map(l=>`<div><strong>${levelData[l].name} · ${levelData[l].labs.length} experiências</strong><span>${levelData[l].theme}.</span></div>`).join('')}</div><p class="lead">As missões, os valores, as tarefas, as explicações e os desafios mudam com o ciclo. Cada percurso guarda o seu próprio progresso.</p></section><section class="card"><h2>Fontes para aprofundar</h2><div class="source-list" style="margin-top:18px"><a href="https://www.dge.mec.pt/referencial-de-educacao-financeira" target="_blank" rel="noopener noreferrer">DGE · Referencial de Educação Financeira<span>Referência para a progressão pedagógica por ciclos; esta aplicação não é um recurso oficial certificado.</span></a><a href="https://www.todoscontam.pt/pt-pt/elaborar-o-orcamento" target="_blank" rel="noopener noreferrer">Todos Contam · Elaborar o orçamento</a><a href="https://clientebancario.bportugal.pt/pt-pt/como-contratar" target="_blank" rel="noopener noreferrer">Banco de Portugal · Comparar crédito</a><a href="https://www.todoscontam.pt/pt-pt/riscos-dos-produtos" target="_blank" rel="noopener noreferrer">Todos Contam · Riscos dos produtos</a><a href="https://info.portaldasfinancas.gov.pt/pt/apoio_contribuinte/questoes_frequentes/pages/faqs-00930.aspx" target="_blank" rel="noopener noreferrer">Autoridade Tributária · IVA</a></div></section><section class="card"><h3>Sobre a FinançaJovem</h3><p class="lead">Usa valores fictícios. As simulações são simplificadas, não são previsões nem aconselhamento financeiro. Não introduzas dados pessoais ou bancários.</p><p class="lead">O progresso fica neste navegador, separado por percurso. Num dispositivo partilhado, descarrega o relatório e apaga os dados no final.</p><p class="small muted" style="margin-top:14px">TIC, Educação e WEB · Desenvolvido com o apoio de inteligência artificial (ChatGPT, da OpenAI).</p></section></aside></div>`}
function report(){const c=cfg(),m=state.mission,finished=m?.choices.length===4,total=activityIds().length;return `${title('O meu percurso · '+c.name,'As escolhas e os resultados apresentados pertencem apenas a este percurso.','Progresso independente')}<h2 class="print-title">FinançaJovem · ${c.name} · TIC, Educação e WEB</h2><div class="stats"><div class="stat purple"><span class="label">Experiências exploradas</span><strong>${count()} / ${total}</strong></div><div class="stat"><span class="label">${c.missionTitle}</span><strong>${finished?'Concluída':m?m.choices.length+'/4':'Por começar'}</strong></div><div class="stat green"><span class="label">Desafios deste ciclo</span><strong>${state.quiz?state.quiz.score+'/6':state.quizDraft&&state.quizDraft.index<6?state.quizDraft.index+'/6 em curso':'Por começar'}</strong></div></div><div class="two-col"><section class="card"><h2>O que já experimentaste</h2><p class="metric-note">Explorar não equivale a dominar o tema. Uma reflexão ajuda a perceber o que aprendeste.</p>${[['missao',c.missionTitle],...currentLabs().map(x=>[x[0],x[2]]),['quiz','Seis desafios do '+c.name]].map(([id,label])=>`<div class="report-line"><span>${label}</span><span class="tag ${state.completed.includes(id)?'green':''}">${state.completed.includes(id)?'Explorado':'Por explorar'}</span></div>`).join('')}<div class="notice">${state.quiz?state.quiz.score+'/6 à primeira tentativa. ':''}${finished?'Na missão guardaste '+money(missionSaved())+(state.level==='secundario'?' livres de compromissos.':'.'):'Podes retomar as experiências deste ciclo mais tarde.'}</div>${resultDetails()?'<h3 class="subheading">Últimos resultados deste percurso</h3>'+resultDetails():''}${state.goal?`<h3 class="subheading">A meta: ${esc(state.goal.name)}</h3><p class="small muted">${money(Finance.goal(state.goal.target,state.goal.initial,state.goal.entries).total)} / ${money(state.goal.target)} · Até ${formatDate(state.goal.deadline)}</p>`:''}${state.legacy?`<details class="definition"><summary>Histórico anterior preservado</summary><p>${state.legacy.points||0} pontos simbólicos e ${(state.legacy.activities||[]).length} atividades anteriores.</p>${(state.legacy.notes||[]).map(note=>`<p style="white-space:pre-line">${esc(note)}</p>`).join('')}</details>`:''}</section><section class="card"><h2>${state.level==='primeiro'?'Conta o que aprendeste':'Explica uma decisão'}</h2><div class="field"><label for="final-reflection">${c.reflection}</label><textarea id="final-reflection" maxlength="3000" placeholder="Escolhi… O que aconteceu foi…">${esc(state.reflection)}</textarea><small>A reflexão fica guardada neste percurso. Não incluas dados pessoais.</small></div>${m?.reflection?`<h3 class="subheading">Na missão, escreveste</h3><p class="small muted">${esc(m.reflection)}</p>`:''}${state.quiz?.reflection?`<h3 class="subheading">O teu conselho</h3><p class="small muted">${esc(state.quiz.reflection)}</p>`:''}<div class="actions"><button class="btn" data-action="export">Descarregar relatório .txt ↓</button><button class="btn secondary" data-action="print">Imprimir / guardar PDF</button></div><div class="notice">O relatório identifica o ciclo e inclui as decisões, os resultados, os registos e as reflexões deste percurso.</div><h3 class="subheading">Os quatro percursos</h3>${LEVELS.map(l=>{const p=l===state.level?state:profiles[l],done=p?.completed?.filter(x=>['missao',...levelData[l].labs,'quiz'].includes(x)).length||0;return `<div class="report-line"><span>${levelData[l].name}</span><span>${done}/${levelData[l].labs.length+2}</span></div>`}).join('')}<p class="metric-note">Muda de ciclo no seletor para retomar o outro percurso.</p><button class="text-button" data-action="reset-all">Apagar o progresso de todos os percursos</button></section></div>`}
function resultDetails(){return Object.entries(state.results||{}).filter(([id,value])=>typeof value==='string'&&value).map(([id,value])=>`<details class="definition"><summary>${esc(currentLabs().find(x=>x[0]===id)?.[2]||'Orçamento da escola')}</summary><p style="white-space:pre-line">${esc(value)}</p></details>`).join('')}
const fieldLabels={'b-income':'Rendimento (€)','b-essential':'Necessidades (€)','b-leisure':'Lazer (€)','b-saving':'Objetivo (€)','b-reserve':'Reserva (€)','b-shock':'Imprevisto (€)','s-initial':'Poupança inicial (€)','s-monthly':'Entrega por período (€)','s-months':'Número de períodos','s-rate':'Taxa anual (%)','r-capital':'Capital (€)','r-years':'Prazo (anos)','r-inflation':'Inflação (%)','r-cost':'Custo anual (%)','c-need':'Quantidade necessária','c-a-price':'Preço da embalagem A (€)','c-a-volume':'Quantidade por embalagem A','c-b-price':'Preço da embalagem B (€)','c-b-volume':'Quantidade por embalagem B','c-delivery':'Portes B (€)','k-capital':'Montante emprestado (€)','k-rate':'TAN (%)','k-months':'Prazo A (meses)','k-fees':'Encargo inicial (€)','t-price':'Preço (€)','t-rate':'Taxa fictícia de imposto (%)','t-books':'Livros (€)','t-sport':'Desporto (€)','t-access':'Acessibilidade (€)','n-price':'Preço de venda (€)','n-unit':'Material por unidade (€)','n-fixed':'Custos fixos (€)','n-quantity':'Unidades vendidas','n-produced':'Unidades produzidas'};
function exportReport(){const c=cfg(),lines=['FINANÇAJOVEM — '+c.name.toUpperCase(),'TIC, Educação e WEB',new Intl.DateTimeFormat('pt-PT',{dateStyle:'long',timeStyle:'short'}).format(new Date()),'Valores fictícios · Simulações educativas','',c.theme,`Experiências exploradas: ${count()}/${activityIds().length}`,''];if(state.mission){const m=state.mission;lines.push('MISSÃO: '+c.missionTitle,`Disponível: ${money(c.budget)} · Já guardado: ${money(c.initial)} · Meta: ${money(c.target)}`,`Plano: guardar ${money(m.plan)}`);m.choices.forEach((choice,i)=>{const o=currentEvents()[i].options[choice];lines.push(`${c.period} ${i+1}: ${o[0]} — ${money(o[1])} agora${o[3]?.future?' e '+money(o[3].future)+' depois':''}`,o[2])});if(m.pending!==null){const o=currentEvents()[m.choices.length]?.options[m.pending-1];if(o)lines.push('Escolha em análise, ainda não avançada: '+o[0])}lines.push(`Dinheiro após escolhas concluídas: ${money(missionBalance())}`,...(state.level==='secundario'?[`Compromissos futuros: ${money(missionDebt())}`]:[]),`${state.level==='primeiro'?'Dinheiro para guardar':'Poupança livre'}: ${money(missionSaved())}`,`Reflexão da missão: ${m.reflection||'—'}`,'')}
lines.push('EXPERIÊNCIAS DESTE PERCURSO',...currentLabs().filter(x=>state.completed.includes(x[0])).map(x=>'✓ '+x[2]),'','VALORES USADOS (conforme as unidades dos campos)',...Object.entries(state.labValues).map(([k,v])=>(fieldLabels[k]||k)+': '+formatNum(Number(v))),'','RESULTADOS DAS EXPERIÊNCIAS',...Object.entries(state.results||{}).map(([id,value])=>(currentLabs().find(x=>x[0]===id)?.[2]||'Orçamento da escola')+'\n'+value));if(state.quiz)lines.push('','DESAFIOS: '+c.name,`${state.quiz.score}/6 à primeira tentativa`,...questionBanks[state.level].map((q,i)=>`${i+1}. ${q[0]}\nResposta inicial: ${q[1][state.quiz.answers?.[i]]??'—'}\nIdeia a reter: ${q[3]}`),'Reflexão: '+(state.quiz.reflection||'—'));if(state.goal){const g=state.goal;lines.push('','META: '+g.name,`Inicial: ${money(g.initial)} · Objetivo: ${money(g.target)} · Limite: ${g.deadline}`,`Total guardado: ${money(Finance.goal(g.target,g.initial,g.entries).total)}`,...Object.entries(g.entries).sort().map(([d,v])=>d+': '+money(v)))}if(state.legacy)lines.push('','HISTÓRICO ANTERIOR',...(state.legacy.activities||[]),...(state.legacy.notes||[]));lines.push('','REFLEXÃO FINAL',state.reflection||'Ainda não registada.','','Exercícios simplificados, sem dados bancários reais.');const blob=new Blob(['\ufeff'+lines.join('\n')],{type:'text/plain;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='FinancaJovem_'+state.level+'_percurso.txt';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);announce('Relatório do '+c.name+' preparado para descarregar.')}
function confirmAction(title,text,fn){$('#dialog-title').textContent=title;$('#dialog-text').textContent=text;dialogAction=fn;$('#confirm-dialog').showModal();$('#cancel-dialog').focus()}
document.addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;if(t.dataset.go){if(t.dataset.go==='laboratorio')lab='';go(t.dataset.go)}if(t.dataset.lab){lab=t.dataset.lab;go('laboratorio')}if(t.hasAttribute('data-choice')){const m=state.mission,i=Number(t.dataset.choice);if(m&&m.pending===null&&m.choices.length<4&&currentEvents()[m.choices.length].options[i][1]<=missionBalance()){m.pending=i+1;save();render();announce('Escolha registada. Lê a consequência antes de avançar.')}}if(t.hasAttribute('data-answer')){const q=quizSession;if(q&&q.index<6&&q.selected===null){q.selected=Number(t.dataset.answer);if(!q.tried){q.answers[q.index]=q.selected;if(q.selected===questionBanks[q.level][q.index][2])q.score++;q.tried=true}render()}}if(t.dataset.preset){const presets=cfg().presets;['b-income','b-essential','b-leisure','b-saving','b-reserve'].forEach((id,i)=>$('#'+id).value=presets[t.dataset.preset][i]);$('#b-shock').value='0';calcBudget(false)}const action=t.dataset.action;if(action==='back-labs'){lab='';go('laboratorio')}if(action==='restart-mission')confirmAction('Experimentar outro mês?','As escolhas e a reflexão da missão atual serão substituídas. O resto do percurso mantém-se.',()=>{state.mission=null;state.completed=state.completed.filter(x=>x!=='missao');save();render()});if(action==='mission-next'){const m=state.mission;if(m&&m.pending!==null){m.choices.push(m.pending-1);m.pending=null;if(m.choices.length===4)complete('missao');save();render();$('#main').focus();window.scrollTo({top:0,behavior:'instant'})}}if(action==='start-quiz'){quizSession={level:state.level,index:0,score:0,selected:null,tried:false,answers:[]};render()}if(action==='retry-question'&&quizSession){quizSession.selected=null;render()}if(action==='next-question'&&quizSession&&quizSession.selected!==null){quizSession.index++;quizSession.selected=null;quizSession.tried=false;if(quizSession.index===6){state.quiz={level:quizSession.level,score:quizSession.score,answers:quizSession.answers,reflection:''};complete('quiz');save()}render();$('#main').focus()}if(action==='reset-goal')confirmAction('Criar outra meta?','O plano e os registos diários da meta atual serão apagados. Descarrega o relatório primeiro, se quiseres guardá-los.',()=>{state.goal=null;state.completed=state.completed.filter(x=>x!=='meta');save();render()});if(action==='export')exportReport();if(action==='print')window.print();if(action==='reset-all')confirmAction('Apagar os quatro percursos?','Isto apaga as escolhas, os resultados, as metas e as reflexões de todos os ciclos neste navegador. Descarrega os relatórios antes, se os quiseres guardar.',()=>{const level=state.level;profiles={};state=defaults(level);quizSession=null;lab='';storageNote='';try{localStorage.removeItem('financajovem.v2')}catch(e){}save();go('inicio')})});
$('#cancel-dialog').addEventListener('click',()=>{$('#confirm-dialog').close();dialogAction=null});$('#accept-dialog').addEventListener('click',()=>{const fn=dialogAction;dialogAction=null;$('#confirm-dialog').close();fn?.()});$('#confirm-dialog').addEventListener('cancel',()=>dialogAction=null);
$('#level').addEventListener('change',e=>switchLevel(e.target.value));
document.addEventListener('input',e=>{if(e.target.id==='final-reflection'){state.reflection=e.target.value;save()}if(e.target.id==='mission-reflection'&&state.mission){state.mission.reflection=e.target.value;save()}if(e.target.id==='quiz-reflection'&&state.quiz){state.quiz.reflection=e.target.value;save()}if(e.target.closest('#budget-form'))calcBudget(false)});
document.addEventListener('change',e=>{if(e.target.id==='b-shock')calcBudget(false);if(e.target.id==='g-day'&&state.goal)$('#g-amount').value=state.goal.entries[e.target.value]||0});
document.addEventListener('submit',e=>{e.preventDefault();const id=e.target.id;if(id==='mission-start'){try{const plan=read('mission-plan');state.mission={plan,choices:[],pending:null,reflection:''};save();render()}catch(err){announce(err.message)}}if(id==='budget-form')calcBudget(true);if(id==='savings-form')calcSavings();if(id==='risk-form')calcRisk();if(id==='shopping-form')calcShopping();if(id==='credit-form')calcCredit();if(id==='tax-form'){state.taxMode=$('#t-mode').value;calcTax();}if(id==='business-form')calcBusiness();if(id==='school-form')evaluateSchool();if(id==='goal-start'){try{const target=read('g-target'),initial=read('g-initial'),deadline=$('#g-deadline').value,name=$('#g-name').value.trim();if(!name)throw Error('Dá um nome à tua meta.');if(initial>target)throw Error('O valor inicial não pode superar a meta.');if(deadline<Finance.date())throw Error('Escolhe hoje ou uma data futura.');state.goal={name,target,initial,start:Finance.date(),deadline,entries:{}};complete('meta');save();render()}catch(err){labError(err.message)}}if(id==='goal-record'){try{const day=$('#g-day').value,amount=read('g-amount'),g=state.goal;if(day<g.start||day>Finance.date()||day>g.deadline)throw Error('Escolhe um dia entre o início do plano e hoje, dentro do prazo.');g.entries[day]=amount;save();render();announce('Valor do dia guardado. Um registo anterior desse dia foi substituído.')}catch(err){labError(err.message)}}});
const resultTargets={'budget-form':['orcamento','#budget-result'],'savings-form':['poupanca','#savings-result'],'risk-form':['risco','#risk-result'],'shopping-form':['compras','#shopping-result'],'credit-form':['credito','#credit-result'],'tax-form':['iva','#tax-result'],'business-form':['negocio','#business-result'],'school-form':['escola','#school-result']};
document.addEventListener('submit',e=>{const target=resultTargets[e.target.id];if(!target||$('#lab-error')?.textContent)return;const output=$(target[1]);if(output&&output.innerText.trim()){if(!state.results||typeof state.results!=='object')state.results={};state.results[target[0]]=output.innerText;save()}});
function evaluateSchool(){try{const ids=['t-books','t-sport','t-access'],ns=ids.map(read),sum=ns.reduce((a,b)=>a+b,0),total=cfg().school;$('#school-result').innerHTML=`<div class="notice ${sum>total?'error':'green'}">${sum>total?'Excedes o orçamento em '+money(sum-total)+'. Revê a distribuição.':sum<total?'Ficam '+money(total-sum)+' por atribuir. Podes explicar por que os manténs em reserva.':'Distribuíste todo o orçamento. Aumentar uma proposta implica reduzir outra.'}<br>Livros: ${money(ns[0])} · Desporto: ${money(ns[1])} · Acessibilidade: ${money(ns[2])}.</div>`;remember(ids);if(sum<=total)complete('iva')}catch(e){$('#school-result').textContent=e.message}}
document.addEventListener('click',e=>{const t=e.target.closest('button');if(t&&(t.hasAttribute('data-answer')||['start-quiz','retry-question','next-question'].includes(t.dataset.action)))save()});
function bindView(){if(route==='laboratorio'&&lab==='iva'&&$('#t-mode'))$('#t-mode').value=state.taxMode||(state.level==='secundario'?'included':'excluded');if(route==='laboratorio'&&lab==='orcamento'){const e=$('#b-shock');e.value=state.labValues['b-shock']||'0';calcBudget(false)}}
window.addEventListener('hashchange',()=>{const name=location.hash.slice(1);if(name!==route)go(name)});
go(location.hash.slice(1)||'inicio',false);
</script>
</body></html>
