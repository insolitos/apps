'use strict';
const Finance = {
 money(v){return new Intl.NumberFormat('pt-PT',{style:'currency',currency:'EUR'}).format(v)},
 round(v){return Math.round((v+Number.EPSILON)*100)/100},
 savings(initial,monthly,months,annual){const r=Math.pow(1+annual/100,1/12)-1;let v=initial;const series=[v];for(let i=0;i<months;i++){v=v*(1+r)+monthly;series.push(v)}return{value:v,paid:initial+monthly*months,gain:v-initial-monthly*months,series}},
 credit(capital,annual,months,fees){const r=annual/1200;const payment=r===0?capital/months:capital*r/(1-Math.pow(1+r,-months));return{payment,total:payment*months+fees,interest:payment*months-capital,fees}},
 budget(income,essential,leisure,saving,reserve,shock=0){const spend=essential+leisure+shock;return{spend,allocated:spend+saving+reserve,free:income-spend-saving-reserve,remaining:income-spend}},
 goal(target,initial,entries){const total=initial+Object.values(entries).reduce((a,b)=>a+b,0);return{total,remaining:Math.max(0,target-total),percent:Math.min(100,total/target*100)}},
 buy(price,volume,need,delivery=0){const packs=Math.ceil(need/volume);return{unit:price/volume,packs,total:packs*price+delivery,excess:packs*volume-need}},
 vat(price,rate,included){const net=included?price/(1+rate/100):price;return{net,tax:net*rate/100,total:net*(1+rate/100)}},
 business(price,unit,fixed,quantity){const margin=price-unit;return{revenue:price*quantity,cost:fixed+unit*quantity,profit:margin*quantity-fixed,breakEven:margin>0?Math.ceil(fixed/margin):null}},
 date(){const d=new Date();return[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')},
 days(a,b){return Math.round((Date.parse(b+'T12:00:00Z')-Date.parse(a+'T12:00:00Z'))/86400000)}
};

function missionHistory(){return `<ol class="timeline">${state.mission.choices.map((choice,i)=>`<li><strong>Semana ${i+1} · ${esc(events[i].options[choice][0])}</strong><p>${money(events[i].options[choice][1])} · ${events[i].options[choice][2]}</p></li>`).join('')}</ol>`}
const labs=[['orcamento','◫','Um orçamento que faz sentido','Distribui o dinheiro e testa um imprevisto.','Todos os níveis'],['poupanca','⌁','O tempo também conta','Compara três hipóteses de poupança e juros.','Todos os níveis'],['compras','🛒','A promoção compensa?','Compara quantidades, preços e portes.','Todos os níveis'],['meta','◎','Poupa para um objetivo','Planeia uma meta e regista valores fictícios por dia.','Todos os níveis'],['risco','↗','E se o valor descer?','Explora ganhos, perdas e poder de compra.','3.º ciclo · Secundário'],['credito','▤','A prestação não é tudo','Compara prazos e o custo de um empréstimo.','Secundário'],['iva','%','Impostos e escolhas coletivas','Desmonta um preço e distribui um orçamento escolar.','3.º ciclo · Secundário'],['negocio','✦','Uma ideia, muitas contas','Descobre receitas, custos e ponto de equilíbrio.','Todos os níveis']];
function laboratory(){if(!lab)return `${title('Laboratório de possibilidades','Muda uma variável. Observa o resultado. Explica o que descobriste.','8 experiências')}<div class="notice">${recommend()} Todos os simuladores estão disponíveis; o nível orienta o percurso e os desafios.</div><div class="lab-grid">${labs.map(([id,icon,h,p,level])=>`<button class="card lab-card" data-lab="${id}"><span class="lab-icon" aria-hidden="true">${icon}</span><span><h2>${h} ${state.completed.includes(id)?'<span class="badge-done" aria-label="Explorado">✓</span>':''}</h2><p>${p}</p><span class="tag">${level}</span></span></button>`).join('')}</div>`;
const info=labs.find(x=>x[0]===lab);return `<button class="back" data-action="back-labs">← Todas as experiências</button>${title(info[2],info[3],info[4])}${({orcamento:budgetView,poupanca:savingsView,compras:shoppingView,meta:goalView,risco:riskView,credito:creditView,iva:taxView,negocio:businessView}[lab])()}`}
function num(id,label,value,min=0,max=100000,step='0.01',help=''){return `<div class="field"><label for="${id}">${label}</label><input id="${id}" name="${id}" type="number" min="${min}" max="${max}" step="${step}" value="${value}" required>${help?`<small>${help}</small>`:''}</div>`}
function val(id,fallback){return state.labValues[id]??fallback}
function read(id){const e=$('#'+id);if(!e||!e.checkValidity())throw Error('Confere o valor de '+(e?.labels?.[0]?.textContent||id));const n=Number(e.value);if(!Number.isFinite(n))throw Error('Introduz um número válido.');return n}
function labError(s){const e=$('#lab-error');if(e){e.textContent=s;e.setAttribute('role','alert')}}
function remember(ids){for(const id of ids)state.labValues[id]=$('#'+id).value;save()}
function errorSlot(){return '<p id="lab-error" class="error-text" role="alert"></p>'}
function budgetView(){return `<div class="two-col"><section class="card"><div class="panel-title"><h2>Planeia o teu mês</h2><span class="tag green">Atualização imediata</span></div><div class="actions"><button class="btn secondary small" data-preset="mesada">Mesada</button><button class="btn secondary small" data-preset="estudante">Estudante</button><button class="btn secondary small" data-preset="apertado">Orçamento apertado</button></div><form id="budget-form"><div class="fields">${num('b-income','Rendimento disponível (€)',val('b-income',100),0,10000)}${num('b-essential','Despesas necessárias (€)',val('b-essential',35),0,10000)}${num('b-leisure','Despesas de lazer (€)',val('b-leisure',20),0,10000)}${num('b-saving','Para o objetivo (€)',val('b-saving',25),0,10000)}${num('b-reserve','Reserva para imprevistos (€)',val('b-reserve',10),0,10000)}</div><div class="field"><label for="b-shock">E se surgir um imprevisto?</label><select id="b-shock"><option value="0">Sem despesa inesperada</option><option value="15">Reparação urgente: +15 €</option><option value="30">Material necessário: +30 €</option></select><small>O imprevisto é uma despesa adicional. Podes reduzir a reserva planeada para a utilizar.</small></div>${errorSlot()}<button class="btn">Guardar esta experiência</button></form></section><section class="card" id="budget-result" aria-live="polite"></section></div><div class="notice">Receitas − despesas = dinheiro que pode ser guardado. A poupança e a reserva são dinheiro teu colocado de parte, embora entrem na distribuição do orçamento.</div>`}
function calcBudget(record=false){try{const a=['b-income','b-essential','b-leisure','b-saving','b-reserve'];const ns=a.map(read);const shock=read('b-shock'),r=Finance.budget(...ns,shock);labError('');$('#budget-result').innerHTML=`<h2>Para onde vai o dinheiro?</h2><p class="lead">Rendimento: ${money(ns[0])}</p><div class="stats" style="margin-top:20px"><div class="stat"><span class="label">Despesas totais</span><strong>${money(r.spend)}</strong></div><div class="stat purple"><span class="label">A guardar</span><strong>${money(ns[3]+ns[4])}</strong></div><div class="stat"><span class="label">Por distribuir</span><strong>${money(r.free)}</strong></div></div><div class="bar" role="img" aria-label="Distribuição: despesas necessárias ${money(ns[1]+shock)}, lazer ${money(ns[2])}, objetivo ${money(ns[3])}, reserva ${money(ns[4])}, livre ${money(Math.max(0,r.free))}">${[ns[1]+shock,ns[2],ns[3],ns[4],Math.max(0,r.free)].map((v,i)=>`<span style="width:${v/Math.max(1,r.allocated,ns[0])*100}%;background:${['#6752c9','#b6a7e1','#67b795','#9bd6bd','#e1e4ed'][i]}"></span>`).join('')}</div><div class="legend">${['Necessárias','Lazer','Objetivo','Reserva','Livre'].map((x,i)=>`<span><i class="key" style="background:${['#6752c9','#b6a7e1','#67b795','#9bd6bd','#e1e4ed'][i]}"></i>${x}</span>`).join('')}</div><div class="notice ${r.free<0?'error':'green'}">${r.free<0?`O plano ultrapassa o rendimento em ${money(-r.free)}. Reduz uma rubrica ou revê o rendimento; o plano não cria dinheiro.`:r.free===0?'Distribuíste todo o rendimento. Se uma despesa aumentar, terás de ajustar o plano.':`Tens ${money(r.free)} ainda por distribuir. Que função lhe darias?`}</div><h3>Experimenta uma mudança</h3><p class="lead">${shock?'Reduz a reserva pelo valor do imprevisto, se for suficiente. O que acontece à margem?':'Aumenta o lazer em 10 €. Que outra rubrica pode mudar para manter o equilíbrio?'}</p><div class="notice">Exemplo: 100 € − 55 € de despesas = 45 €. Se guardares 35 €, sobram 10 € livres.</div>`;if(record){remember([...a,'b-shock']);complete('orcamento');announce('Experiência de orçamento guardada.')}}catch(e){labError(e.message);$('#budget-result').innerHTML='<div class="notice error">Corrige os valores para veres um resultado válido.</div>'}}
function savingsView(){return `<div class="two-col"><section class="card"><h2>Antes de calcular, prevê</h2><p class="lead">O que terá mais efeito: começar mais cedo ou aumentar a poupança mensal?</p><form id="savings-form"><div class="fields">${num('s-initial','Valor inicial (€)',val('s-initial',100),0,100000)}${num('s-monthly','Poupança mensal (€)',val('s-monthly',10),0,10000)}${num('s-months','Prazo (meses)',val('s-months',24),1,600,1)}${num('s-rate','Taxa anual efetiva hipotética (%)',val('s-rate',3),0,15,'0.1')}</div><div class="field"><label for="s-prediction">A minha previsão</label><select id="s-prediction"><option value="">Escolhe uma previsão (opcional)</option><option>O total será igual ao que guardei.</option><option>O total será superior ao que guardei.</option><option>Preciso de experimentar para perceber.</option></select></div>${errorSlot()}<button class="btn">Comparar três hipóteses →</button></form><p class="metric-note">Entregas no final de cada mês. Capitalização mensal equivalente à taxa anual efetiva. Sem impostos, comissões ou levantamentos. Taxas fictícias e constantes.</p></section><section class="card" id="savings-result"><div class="empty">Faz uma previsão e calcula. Depois muda só uma variável e compara.</div></section></div>`}
function calcSavings(){try{const ids=['s-initial','s-monthly','s-months','s-rate'],[initial,monthly,months,rate]=ids.map(read),r=Finance.savings(initial,monthly,months,rate);remember(ids);complete('poupanca');const rows=[['Sem juros',0],['A tua hipótese',rate],['Taxa alternativa',rate+1]];$('#savings-result').innerHTML=`<h2>O teu plano ao longo do tempo</h2><div class="stats" style="margin-top:20px"><div class="stat"><span class="label">Dinheiro colocado</span><strong>${money(r.paid)}</strong></div><div class="stat purple"><span class="label">Total calculado</span><strong>${money(r.value)}</strong></div><div class="stat green"><span class="label">Juros calculados</span><strong>${money(r.gain)}</strong></div></div>${lineChart(r.series,Array.from({length:months+1},(_,i)=>initial+monthly*i))}<div class="legend"><span><i class="key" style="background:#6752c9"></i>Total com juros</span><span><i class="key" style="background:#67b795"></i>Dinheiro colocado</span></div><div class="table-wrap"><table><caption class="sr-only">Comparação de taxas hipotéticas</caption><thead><tr><th>Hipótese</th><th>Taxa anual</th><th>Final</th></tr></thead><tbody>${rows.map(([label,rate])=>`<tr><td>${label}</td><td>${rate}%</td><td><strong>${money(Finance.savings(initial,monthly,months,rate).value)}</strong></td></tr>`).join('')}</tbody></table></div><div class="notice">${$('#s-prediction').value?`A tua previsão: «${esc($('#s-prediction').value)}»<br>`:''}Compara o total com os ${money(r.paid)} que colocaste. O juro composto remunera também os juros já acumulados. Sem juros, o total corresponde apenas ao dinheiro que colocaste.</div><p class="small muted">E se duplicasses o prazo? Faz a previsão antes de voltar a calcular. Estas hipóteses não são ofertas de produtos nem previsões.</p>`;labError('');announce('Três hipóteses de poupança calculadas.')}catch(e){labError(e.message)}}
function lineChart(series,comparison=null){const all=comparison?[...series,...comparison]:series,min=Math.min(0,...all),max=Math.max(1,...all),plot=a=>a.map((v,i)=>`${25+i/(a.length-1||1)*450},${155-(v-min)/(max-min)*130}`).join(' ');return `<svg class="mini-line" viewBox="0 0 500 180" role="img" aria-label="Evolução do total: começa em ${money(series[0])} e termina em ${money(series.at(-1))}. ${comparison?'Dinheiro colocado no final: '+money(comparison.at(-1)):''}"><path d="M25 25H475M25 90H475M25 155H475" stroke="#e8e8f0" fill="none"/>${comparison?`<polyline points="${plot(comparison)}" fill="none" stroke="#67b795" stroke-width="2.5" stroke-dasharray="5 5"/>`:''}<polyline points="${plot(series)}" fill="none" stroke="#6752c9" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/><text x="25" y="176" font-size="11" fill="#60677d">Início</text><text x="475" y="176" text-anchor="end" font-size="11" fill="#60677d">Fim</text></svg>`}
function riskView(){return `<div class="two-col"><section class="card"><h2>Três futuros possíveis</h2><p class="lead">Investir implica incerteza. Um resultado negativo pode reduzir o capital, mesmo que esperasses um ganho.</p><form id="risk-form"><div class="fields">${num('r-capital','Capital fictício (€)',val('r-capital',500),1,100000)}${num('r-years','Prazo (anos)',val('r-years',3),1,30,1)}${num('r-inflation','Inflação anual hipotética (%)',val('r-inflation',2),0,20,'0.1')}</div>${errorSlot()}<button class="btn">Explorar ganhos e perdas</button></form><div class="notice">Exemplo: uma perda de 20% transforma 100 € em 80 €. Para regressar aos 100 €, é depois necessário ganhar 25% sobre os 80 €.</div><p class="metric-note">Taxas anuais constantes, reinvestimento anual, sem reforços, impostos ou custos. A inflação também é constante. Não há probabilidades atribuídas às hipóteses.</p></section><section class="card" id="risk-result"><div class="empty">As hipóteses serão −10%, +2% e +8% ao ano. Quanto achas que poderá valer o capital?</div></section></div>`}
function calcRisk(){try{const ids=['r-capital','r-years','r-inflation'],[p,y,inf]=ids.map(read);remember(ids);complete('risco');$('#risk-result').innerHTML=`<h2>Capital no fim de ${y} ${y===1?'ano':'anos'}</h2><div class="table-wrap"><table><caption class="metric-note">Valores calculados; não representam intervalos de risco.</caption><thead><tr><th>Hipótese anual</th><th>Valor nominal</th><th>Poder de compra*</th></tr></thead><tbody>${[-10,2,8].map(rate=>{const nominal=p*Math.pow(1+rate/100,y);return `<tr><td>${rate>0?'+':''}${rate}%</td><td>${money(nominal)}</td><td>${money(nominal/Math.pow(1+inf/100,y))}</td></tr>`}).join('')}</tbody></table></div><p class="metric-note">* Em euros com o poder de compra do início do exercício. Dividimos o valor futuro por (1 + inflação)<sup>anos</sup>.</p><div class="notice peach">O capital pode cair abaixo dos ${money(p)} iniciais. As perdas reais podem ser superiores às desta tabela, incluindo a perda total em alguns produtos. Um prazo maior não garante lucro.</div><h3>Antes de decidir, pergunta</h3><ul class="list"><li>Quando vou precisar deste dinheiro?</li><li>Consigo suportar uma perda?</li><li>Quais são os custos e as condições de saída?</li><li>Conheço a entidade e os riscos?</li></ul><p class="small muted">Diversificar pode reduzir a exposição a um único investimento; não elimina todos os riscos.</p>`;labError('')}catch(e){labError(e.message)}}
function shoppingView(){return `<div class="two-col"><section class="card"><h2>Qual é o custo da tua compra?</h2><p class="lead">Precisas de sumo para uma atividade da turma. Os produtos são equivalentes. Uma embalagem maior nem sempre dá a compra mais barata.</p><form id="shopping-form">${num('c-need','Quantidade necessária (litros)',val('c-need',2),0.1,100,'0.1')}<div class="fields">${num('c-a-price','A · preço por embalagem (€)',val('c-a-price',2.4),0.01,1000)}${num('c-a-volume','A · litros por embalagem',val('c-a-volume',1),0.1,100,'0.1')}${num('c-b-price','B · preço por embalagem (€)',val('c-b-price',6.9),0.01,1000)}${num('c-b-volume','B · litros por embalagem',val('c-b-volume',3),0.1,100,'0.1')}</div>${num('c-delivery','B · portes por encomenda (€)',val('c-delivery',1.5),0,1000)}${errorSlot()}<button class="btn">Comparar o custo real</button></form></section><section class="card" id="shopping-result"><div class="notice">A: 2,40 €/litro. B: 2,30 €/litro, mas tens de comprar 3 litros e pagar portes. Para 2 litros, qual escolherias?</div></section></div>`}
function calcShopping(){try{const ids=['c-need','c-a-price','c-a-volume','c-b-price','c-b-volume','c-delivery'],[need,ap,av,bp,bv,delivery]=ids.map(read),a=Finance.buy(ap,av,need),b=Finance.buy(bp,bv,need,delivery);remember(ids);complete('compras');$('#shopping-result').innerHTML=`<h2>Preço por litro ≠ valor a pagar</h2><div class="table-wrap"><table><thead><tr><th></th><th>Produto A</th><th>Produto B</th></tr></thead><tbody><tr><th>Por litro, sem portes</th><td>${money(a.unit)}</td><td>${money(b.unit)}</td></tr><tr><th>Embalagens necessárias</th><td>${a.packs}</td><td>${b.packs}</td></tr><tr><th>Total com portes</th><td><strong>${money(a.total)}</strong></td><td><strong>${money(b.total)}</strong></td></tr><tr><th>Quantidade a mais</th><td>${Finance.round(a.excess)} L</td><td>${Finance.round(b.excess)} L</td></tr></tbody></table></div><div class="notice green">${Math.abs(a.total-b.total)<.005?'As duas opções têm o mesmo custo total.':`A opção ${a.total<b.total?'A':'B'} custa menos ${money(Math.abs(a.total-b.total))} nesta compra.`} O preço por litro ajuda a comparar; o total depende também da quantidade e dos portes.</div><h3>E o que sobra?</h3><p class="lead">Pode ser utilizado a tempo? Há risco de desperdício? E se precisasses de 6 litros? Altera a quantidade e verifica se a tua decisão muda.</p>`;labError('')}catch(e){labError(e.message)}}
function creditView(){return `<div class="two-col"><section class="card"><h2>Uma prestação mais baixa chega?</h2><p class="lead">Compara um prazo com outro duas vezes maior. O crédito é um compromisso futuro, não um rendimento.</p><form id="credit-form"><div class="fields">${num('k-capital','Montante emprestado (€)',val('k-capital',600),1,100000)}${num('k-rate','TAN hipotética (%)',val('k-rate',12),0,50,'0.1')}${num('k-months','Prazo A (meses)',val('k-months',12),1,180,1)}${num('k-fees','Encargo inicial fixo (€)',val('k-fees',20),0,10000)}</div>${errorSlot()}<button class="btn">Comparar os dois prazos</button></form><p class="metric-note">Prestações mensais constantes; taxa mensal = TAN/12; sem carência. O encargo inicial é pago à parte, não financiado. Excluem-se impostos, seguros e outros custos. Os totais usam prestações sem arredondamento intermédio.</p></section><section class="card" id="credit-result"><div class="empty">Experimenta também uma TAN de 0%. Um crédito sem juros pode continuar a ter encargos.</div></section></div><div class="notice"><strong>TAN</strong>: taxa usada para os juros. <strong>TAEG</strong>: medida anual do custo global, incluindo outros encargos previstos. <strong>MTIC</strong>: total a pagar pelo crédito. Na vida real, compara TAEG e MTIC de propostas comparáveis e lê a informação pré-contratual. Este simulador não calcula a TAEG.</div>`}
function calcCredit(){try{const ids=['k-capital','k-rate','k-months','k-fees'],[p,rate,months,fees]=ids.map(read),a=Finance.credit(p,rate,months,fees),b=Finance.credit(p,rate,months*2,fees);remember(ids);complete('credito');$('#credit-result').innerHTML=`<h2>Menos por mês, mais no total?</h2><div class="table-wrap"><table><thead><tr><th></th><th>A · ${months} meses</th><th>B · ${months*2} meses</th></tr></thead><tbody><tr><th>Prestação mensal</th><td>${money(a.payment)}</td><td>${money(b.payment)}</td></tr><tr><th>Juros</th><td>${money(a.interest)}</td><td>${money(b.interest)}</td></tr><tr><th>Encargo inicial</th><td>${money(fees)}</td><td>${money(fees)}</td></tr><tr><th>Total simulado</th><td><strong>${money(a.total)}</strong></td><td><strong>${money(b.total)}</strong></td></tr></tbody></table></div><div class="notice peach">${rate===0?`Com TAN de 0%, os juros são nulos, mas o encargo inicial mantém-se: ${money(fees)}.`:`O prazo B reduz a prestação em ${money(a.payment-b.payment)}, mas aumenta o custo total em ${money(b.total-a.total)}.`}</div><p class="lead">Que parte de um rendimento mensal ficaria comprometida? O que aconteceria perante uma quebra de rendimento?</p>`;labError('')}catch(e){labError(e.message)}}
function taxView(){return `<div class="two-col"><section class="card"><h2>O imposto dentro de um preço</h2><p class="lead">O IVA é um imposto sobre o consumo. Vamos usar uma taxa escolhida para o exercício, sem simular regras fiscais de um produto concreto.</p><form id="tax-form"><div class="fields">${num('t-price','Preço do exercício (€)',val('t-price',120),0,100000)}${num('t-rate','Taxa do exercício (%)',val('t-rate',20),0,100,'0.1')}</div><div class="field"><label for="t-mode">O preço introduzido…</label><select id="t-mode"><option value="included">Já inclui o imposto</option><option value="excluded">Ainda não inclui o imposto</option></select></div>${errorSlot()}<button class="btn">Desmontar o preço</button></form><div id="tax-result"></div><p class="metric-note">A taxa é fictícia. Em Portugal, as taxas aplicáveis dependem do bem ou serviço e da região. Confirma-as na Autoridade Tributária.</p></section><section class="card"><h2>Um orçamento para a escola</h2><p class="lead">Distribui 1 000 € fictícios por três propostas. Cada escolha beneficia uma área e limita as restantes.</p><form id="school-form">${num('t-books','Livros e leitura (€)',400,0,1000,10)}${num('t-sport','Atividades desportivas (€)',300,0,1000,10)}${num('t-access','Acessibilidade e inclusão (€)',300,0,1000,10)}<button class="btn secondary">Avaliar a distribuição</button></form><div id="school-result" aria-live="polite"></div><p class="metric-note">Os impostos financiam serviços públicos através dos orçamentos públicos. Não existe neste exercício uma afetação direta de uma compra à escola.</p></section></div>`}
function calcTax(){try{const ids=['t-price','t-rate'],[p,rate]=ids.map(read),included=$('#t-mode').value==='included',r=Finance.vat(p,rate,included);remember(ids);complete('iva');$('#tax-result').innerHTML=`<div class="notice green" role="status">Base: <strong>${money(r.net)}</strong><br>Imposto: <strong>${money(r.tax)}</strong><br>Total: <strong>${money(r.total)}</strong></div><p class="small muted">${included?'Base = preço total ÷ (1 + taxa/100). O imposto incluído não se obtém multiplicando diretamente o total pela taxa.':'Imposto = base × taxa/100. Total = base + imposto.'}</p>`;labError('')}catch(e){labError(e.message)}}
function businessView(){return `<div class="two-col"><section class="card"><h2>Uma banca na feira da escola</h2><p class="lead">A tua equipa prepara marcadores de livros. Há custos iniciais e um custo por unidade produzida.</p><form id="business-form"><div class="fields">${num('n-price','Preço de venda por unidade (€)',val('n-price',3),0,1000)}${num('n-unit','Custo por unidade (€)',val('n-unit',1.2),0,1000)}${num('n-fixed','Custos fixos (€)',val('n-fixed',15),0,100000)}${num('n-quantity','Unidades produzidas e vendidas',val('n-quantity',40),0,10000,1)}</div>${errorSlot()}<button class="btn">Fazer as contas</button></form><p class="metric-note">Neste modelo, tudo o que se produz é vendido. Não inclui trabalho remunerado, impostos ou outros encargos. Na realidade pode haver produtos por vender.</p></section><section class="card" id="business-result"><div class="notice">Receita não é lucro. Vender 40 unidades a 3 € gera 120 € de receita; ainda tens de pagar os custos.</div></section></div>`}
function calcBusiness(){try{const ids=['n-price','n-unit','n-fixed','n-quantity'],[p,c,f,q]=ids.map(read),r=Finance.business(p,c,f,q);remember(ids);complete('negocio');$('#business-result').innerHTML=`<h2>A ideia consegue sustentar-se?</h2><div class="stats" style="margin-top:20px"><div class="stat"><span class="label">Receita</span><strong>${money(r.revenue)}</strong></div><div class="stat"><span class="label">Custos</span><strong>${money(r.cost)}</strong></div><div class="stat purple"><span class="label">${r.profit<0?'Prejuízo':'Resultado'}</span><strong>${money(r.profit)}</strong></div></div><div class="notice ${r.profit<0?'peach':'green'}">${r.breakEven===null?'O preço não supera o custo por unidade. Vender mais não cria uma margem positiva.':`Precisas de vender pelo menos ${r.breakEven} unidades para cobrir os custos deste modelo. Cada unidade contribui com ${money(p-c)} para pagar os custos fixos e, depois, gerar excedente.`}</div><h3>E se venderes só metade?</h3><p class="lead">Experimenta reduzir a quantidade. Depois discute: e se já tivesses produzido todas as unidades? Os custos de produção manter-se-iam, mesmo sem vender tudo.</p>`;labError('')}catch(e){labError(e.message)}}
function goalView(){const g=state.goal;if(!g){const today=Finance.date(),d=new Date(today+'T12:00:00');d.setDate(d.getDate()+30);const end=[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');return `<div class="two-col"><section class="card"><h2>Transforma uma vontade num plano</h2><form id="goal-start"><div class="field"><label for="g-name">Nome da meta fictícia</label><input id="g-name" value="Visita de estudo" required maxlength="80" autocomplete="off"></div><div class="fields">${num('g-target','Meta total (€)',120,0.01,100000)}${num('g-initial','Já poupado (€)',20,0,100000)}</div><div class="field"><label for="g-deadline">Data limite</label><input id="g-deadline" type="date" min="${today}" max="2036-12-31" value="${end}" required></div>${errorSlot()}<button class="btn">Criar o meu plano</button></form></section><aside class="card"><h3>Uma meta é mais do que um número</h3><p class="lead">Define o valor, o prazo e o ponto de partida. Depois revê o plano quando algo mudar.</p><div class="notice">Usa apenas dados inventados. Não precisas de identificar o aluno nem de introduzir informações da tua família.</div><p class="small muted">O registo é diário. Se corrigires o mesmo dia, o valor anterior é substituído; não é somado outra vez.</p></aside></div>`}
const r=Finance.goal(g.target,g.initial,g.entries),today=Finance.date(),left=Math.max(0,Finance.days(today,g.deadline)),elapsed=Math.max(0,Finance.days(g.start,today));return `<div class="two-col"><section class="card"><div class="panel-title"><h2>${esc(g.name)}</h2><span class="tag green">${r.percent.toFixed(0)}%</span></div><div class="stats"><div class="stat purple"><span class="label">Guardado</span><strong>${money(r.total)}</strong></div><div class="stat"><span class="label">Meta</span><strong>${money(g.target)}</strong></div><div class="stat"><span class="label">Dias restantes</span><strong>${left}</strong></div></div><div class="bar" role="progressbar" aria-label="Progresso da meta" aria-valuenow="${r.percent.toFixed(0)}" aria-valuemin="0" aria-valuemax="100"><span style="width:${r.percent}%;background:var(--purple)"></span></div><div class="notice ${r.remaining===0?'green':left===0?'peach':''}">${r.remaining===0?'Atingiste a meta fictícia. Que hábito te ajudou?':left===0?'Chegaste à data limite com '+money(r.remaining)+' por guardar. Podes criar um novo plano e discutir o prazo.':`Faltam ${money(r.remaining)}. Como referência, cerca de ${money(r.remaining/(left+1))} por dia, contando hoje e a data limite.`}</div><p class="small muted">Início: ${formatDate(g.start)} · Limite: ${formatDate(g.deadline)} · ${elapsed} dias decorridos.</p><h3 class="subheading">Registos diários</h3>${Object.keys(g.entries).length?`<div class="table-wrap"><table><thead><tr><th>Dia</th><th>Poupança</th></tr></thead><tbody>${Object.entries(g.entries).sort(([a],[b])=>b.localeCompare(a)).slice(0,31).map(([day,amount])=>`<tr><td>${formatDate(day)}</td><td>${money(amount)}</td></tr>`).join('')}</tbody></table></div><p class="metric-note">Últimos 31 dias registados. O relatório inclui todos.</p>`:'<p class="small muted">Ainda não há registos. O valor inicial é '+money(g.initial)+'.</p>'}<button class="text-button" data-action="reset-goal">Criar outra meta</button></section><section class="card"><h2>Registar ou corrigir um dia</h2><p class="lead">Um dia tem um único valor. Podes escrever 0 para remover o seu contributo.</p><form id="goal-record"><div class="field"><label for="g-day">Dia do registo</label><input id="g-day" type="date" min="${g.start}" max="${today<g.deadline?today:g.deadline}" value="${today<=g.deadline?today:g.deadline}" required></div>${num('g-amount','Valor fictício poupado nesse dia (€)',g.entries[today<=g.deadline?today:g.deadline]||0,0,100000)}${errorSlot()}<button class="btn">Guardar o valor deste dia</button></form><div class="notice">Editar 5 € para 7 € no mesmo dia aumenta o total apenas em 2 €. Todos os valores ficam neste navegador.</div><button class="btn secondary" data-go="progresso">Levar os registos para o relatório</button></section></div>`}
function formatDate(s){return new Intl.DateTimeFormat('pt-PT').format(new Date(s+'T12:00:00'))}
const questionBanks={
basico:[

['Guardas 2 € por semana. Sem juros nem gastos, quanto juntas em 5 semanas?',['7 €','10 €','12 €'],1,'2 € × 5 semanas = 10 €. Um hábito pequeno pode aproximar-te de uma meta.'],
['Um lanche custa 2 €. Uma embalagem com três custa 5 €. Só precisas de um e o resto estraga-se. Qual custa menos para essa necessidade?',['O lanche de 2 €.','A embalagem de 5 €.','Custam o mesmo.'],0,'A embalagem é mais barata por unidade, mas pagar 5 € e desperdiçar não é a compra mais económica para uma só unidade.'],
['Recebes uma mensagem que pede o PIN de um cartão. O que fazes?',['Partilho, se tiver um logótipo conhecido.','Peço a um amigo para responder.','Não partilho e procuro um adulto de confiança.'],2,'Um logótipo pode ser copiado. PIN, palavras-passe e códigos de segurança não devem ser partilhados.'],

['Escolhes gastar 8 € no cinema em vez de os guardar para uma bicicleta. O que é o custo de oportunidade?',['O valor da melhor alternativa de que abdicaste.','Uma multa por gastar.','O dinheiro desaparece duas vezes.'],0,'Usar recursos numa opção impede usá-los simultaneamente noutra. Isso não torna o lazer errado: torna a escolha consciente.']

['Um cartão de débito e um cartão de crédito funcionam sempre da mesma forma?',['Sim, ambos oferecem dinheiro.','Não. No crédito usas um limite emprestado, que tens de reembolsar.','Sim, nenhum pode ter custos.'],1,'O débito movimenta fundos da conta, podendo existir condições de descoberto. No crédito há um empréstimo a reembolsar e podem existir juros e encargos.'],

['Um capital perde 20% e passa de 100 € para 80 €. Quanto precisa de ganhar para regressar a 100 €?',['20%','10%','25%'],2,'20 € sobre uma base de 80 € são 25%. Uma perda e um ganho com a mesma percentagem não se anulam.'],

['O que consegue a diversificação de investimentos?',['Eliminar qualquer possibilidade de perda.','Reduzir a exposição a um único ativo, mantendo riscos.','Garantir a melhor rendibilidade.'],1,'Distribuir por ativos diferentes pode reduzir a concentração. Não elimina todos os riscos e não assegura um ganho.']

function quiz(){if(!quizSession)return `${title('Seis escolhas. Seis descobertas.','O feedback explica o raciocínio. Avança quando estiveres pronto.','Desafio · 8 min')}<div class="two-col"><section class="card"><div class="eyebrow">PERGUNTAR TAMBÉM É APRENDER</div><h2>O que farias nesta situação?</h2><p class="lead">Seis perguntas para ${levelName(state.level).toLowerCase()}. Uma resposta de cada vez, com explicação e oportunidade de voltar a tentar.</p><div class="notice">O resultado regista as respostas certas à primeira tentativa. As novas tentativas servem para aprender e não alteram esse resultado.</div><button class="btn" data-action="start-quiz">Começar os seis desafios →</button></section><aside class="card"><h3>Mais do que acertar</h3><ul class="list"><li>Lê a situação com atenção.</li><li>Escolhe e lê a explicação.</li><li>Se precisares, volta a tentar.</li><li>Relaciona a ideia com outra situação.</li></ul>${state.quiz?`<div class="notice green">Último percurso: ${state.quiz.score}/6 à primeira tentativa · ${levelName(state.quiz.level)}.</div>`:''}</aside></div>`;
const q=quizSession,bank=questionBanks[q.level];if(q.index===6)return `${title('Agora, explica com as tuas palavras.','Acertar é um passo. Transferir a aprendizagem é o seguinte.','Desafio concluído')}<section class="card quiz-width"><div class="result-hero"><div class="result-icon" aria-hidden="true">✧</div><h2>${q.score} de 6 à primeira tentativa</h2><p>Experimentaste seis situações. Podes rever cada explicação e voltar ao desafio quando quiseres.</p></div><div class="field"><label for="quiz-reflection">Que conselho darias a um colega antes de uma compra ou de um empréstimo?</label><textarea id="quiz-reflection" maxlength="1500" placeholder="Antes de decidir, eu verificaria…">${esc(state.quiz?.reflection||'')}</textarea></div><div class="actions"><button class="btn" data-go="progresso">Ver o meu percurso</button><button class="btn secondary" data-action="start-quiz">Voltar a praticar</button></div><h3 class="subheading">Rever as seis ideias</h3>${bank.map(([question,options,answer,explanation],i)=>`<details class="definition"><summary>${i+1}. ${question}</summary><p><strong>${options[answer]}</strong></p><p>${explanation}</p></details>`).join('')}</section>`;
const [question,options,answer,explanation]=bank[q.index],answered=q.selected!==null,correct=q.selected===answer;return `${title('Põe as ideias à prova',levelName(q.level)+' · Podes sair e retomar esta tentativa durante a sessão.','Pergunta '+(q.index+1)+' de 6')}<section class="card quiz-width"><div class="steps" aria-label="${q.index} de 6 perguntas concluídas">${bank.map((x,i)=>`<span class="step ${i<q.index?'done':''}"></span>`).join('')}</div><div class="eyebrow">DECIDIR COM INFORMAÇÃO</div><h2 class="question-title">${question}</h2>${options.map((o,i)=>`<button class="choice ${answered&&i===q.selected?(correct?'correct':'wrong'):''}" data-answer="${i}" ${answered?'disabled':''}><span class="circle">${'ABC'[i]}</span><strong>${o}</strong></button>`).join('')}${answered?`<div class="notice ${correct?'green':'peach'}" role="status"><strong>${correct?'Essa escolha faz sentido.':'Vamos olhar para o raciocínio.'}</strong><br>${explanation}</div><div class="actions">${!correct?'<button class="btn secondary" data-action="retry-question">Tentar esta pergunta de novo</button>':''}<button class="btn" data-action="next-question">${q.index===5?'Terminar e refletir':'Próxima pergunta'} →</button></div>`:'<p class="metric-note">A explicação fica visível até decidires avançar.</p>'}</section>`}
function levelName(l){return {basico:'1.º e 2.º ciclos',terceiro:'3.º ciclo',secundario:'Ensino secundário'}[l]||'3.º ciclo'}
const definitions=[['Necessidade ou desejo?','Uma necessidade é algo essencial no contexto da pessoa. Um desejo pode dar prazer sem ser indispensável. A classificação depende da situação.','Um telemóvel pode servir uma necessidade de comunicação; escolher o modelo mais caro pode acrescentar um desejo.'],['Orçamento e saldo','Um orçamento antecipa receitas e despesas. Um saldo negativo pede a revisão das escolhas. Poupar é guardar recursos para mais tarde.','Receber 60 €, gastar 35 € e guardar 20 € deixa 5 € por distribuir.'],['Fundo de emergência','É uma reserva para despesas imprevistas ou quebras de rendimento. Ajuda a evitar depender de crédito numa urgência.','Uma reparação inesperada pode obrigar a usar a reserva e a voltar a constituí-la depois.'],['Juros e capitalização','Os juros podem remunerar uma poupança ou ser um custo de um empréstimo. Com capitalização, os juros acumulados entram nos cálculos seguintes.','100 € a 3% ao ano, com capitalização anual e sem custos, tornam-se 103 € ao fim de um ano e 106,09 € ao fim de dois.'],['Débito, crédito e segurança','No débito movimentas a conta; no crédito utilizas dinheiro emprestado, sujeito a reembolso e às condições contratadas. Nunca partilhes PIN, palavras-passe ou códigos.','Uma ligação com um logótipo conhecido pode ser falsa. Confirma pelo sítio ou aplicação oficial, sem seguir a ligação suspeita.'],['Risco, liquidez e inflação','Risco inclui poder perder dinheiro. Liquidez é a facilidade de dispor dele. A inflação reduz o poder de compra quando os preços sobem.','Um montante pode crescer em euros e, ainda assim, comprar menos do que antes se os preços crescerem mais.'],['Crédito: TAN, TAEG e MTIC','A TAN mede a taxa nominal dos juros. A TAEG traduz o custo global anual do crédito nos termos aplicáveis. O MTIC é o valor total a pagar.','Uma prestação menor durante mais meses pode levar a um total maior. Compara propostas equivalentes e todas as condições.'],['Impostos e cidadania','Os impostos contribuem para financiar serviços e políticas públicas. As escolhas coletivas também exigem prioridades e prestação de contas.','Distribuir um orçamento por livros, desporto e acessibilidade implica discutir necessidades e custos de oportunidade.'],['Receita, custo e resultado','Receita é o valor das vendas. O resultado obtém-se subtraindo os custos. O ponto de equilíbrio indica as vendas necessárias para cobrir os custos do modelo.','100 € de vendas e 70 € de custos deixam um resultado de 30 €, antes de outros encargos.']];
function learn(){return `${title('Aprender para poder escolher','Explicações curtas, exemplos próximos e fontes para aprofundar.','Para alunos e professores')}<div class="two-col"><section><h2 style="margin-bottom:17px">Uma ideia de cada vez</h2>${definitions.map(([h,p,e])=>`<details class="definition"><summary>${h}</summary><p>${p}</p><p class="example"><strong>Um exemplo:</strong> ${e}</p></details>`).join('')}</section><aside class="stack"><section class="card"><div class="eyebrow">GUIA DE AULA · 45 MINUTOS</div><h2>Prever → experimentar → explicar</h2><ol class="list"><li><strong>5 min:</strong> em pares, prever como distribuir 60 €.</li><li><strong>12 min:</strong> completar «O mês é teu» e justificar uma escolha.</li><li><strong>12 min:</strong> escolher um simulador e alterar uma única variável.</li><li><strong>8 min:</strong> responder aos seis desafios do nível.</li><li><strong>8 min:</strong> comparar raciocínios e descarregar o relatório.</li></ol><div class="notice">1.º/2.º ciclos: números pequenos e leitura acompanhada. 3.º ciclo: orçamento e segurança. Secundário: custos do crédito, risco, impostos e negócio.</div><p class="small muted">Pergunta de transferência: «Que informação faltaria para tomares esta decisão numa situação real?»</p></section><section class="card"><h2>Fontes e enquadramento</h2><p class="lead">Conteúdos de apoio de entidades oficiais. Consulta pedagógica: 5 de novembro de 2026.</p><div class="source-list" style="margin-top:20px"><a href="https://www.todoscontam.pt/pt-pt/elaborar-o-orcamento" target="_blank" rel="noopener noreferrer">Todos Contam · Elaborar o orçamento<span>Planeamento de rendimentos, despesas e poupança.</span></a><a href="https://clientebancario.bportugal.pt/pt-pt/como-contratar" target="_blank" rel="noopener noreferrer">Banco de Portugal · Crédito aos consumidores<span>Informação e comparação antes da contratação.</span></a><a href="https://www.todoscontam.pt/pt-pt/riscos-dos-produtos" target="_blank" rel="noopener noreferrer">Todos Contam · Riscos dos produtos<span>Capital, mercado, liquidez e inflação.</span></a><a href="https://info.portaldasfinancas.gov.pt/pt/apoio_contribuinte/questoes_frequentes/pages/faqs-00930.aspx" target="_blank" rel="noopener noreferrer">Autoridade Tributária · IVA<span>Consulta de informação fiscal oficial.</span></a></div></section><section class="card"><h3>Sobre esta versão</h3><p class="lead">Parte da FinançaJovem e do seu artigo de apresentação, preservando o foco escolar. Os exemplos usam valores fictícios e hipóteses simplificadas; não são ofertas, previsões ou aconselhamento financeiro.</p><p class="lead">Sem contas de alunos. O progresso fica no navegador deste dispositivo. Numa utilização partilhada, descarrega o relatório e apaga o progresso no final.</p><p class="small muted" style="margin-top:14px">TIC, Educação e WEB · Conceção pedagógica de Ana Ferreira e Jorge Borges. Versão desenvolvida com o apoio de inteligência artificial (ChatGPT, da OpenAI).</p></section></aside></div>`}
function report(){const m=state.mission,finished=m?.choices.length===4;return `${title('O teu percurso de aprendizagem','Guarda as descobertas, explica as decisões e leva contigo o relatório.','Só neste navegador')}<h2 class="print-title">FinançaJovem · TIC, Educação e WEB</h2><div class="stats"><div class="stat purple"><span class="label">Experiências exploradas</span><strong>${count()} / 10</strong></div><div class="stat"><span class="label">Missão</span><strong>${finished?'Concluída':m?m.choices.length+'/4':'Por começar'}</strong></div><div class="stat green"><span class="label">Último desafio</span><strong>${state.quiz?state.quiz.score+'/6':'Por começar'}</strong></div></div><div class="two-col"><section class="card"><h2>As tuas experiências</h2><p class="metric-note">Explorar é realizar e guardar uma experiência; não equivale a dominar o tema.</p>${[['missao','O mês é teu'],...labs.map(x=>[x[0],x[2]]),['quiz','Seis desafios']].map(([id,label])=>`<div class="report-line"><span>${label}</span><span class="tag ${state.completed.includes(id)?'green':''}">${state.completed.includes(id)?'Explorado':'Por explorar'}</span></div>`).join('')}<div class="notice">${state.quiz?`${levelName(state.quiz.level)}: ${state.quiz.score}/6 respostas certas à primeira tentativa.`:'Os desafios dão feedback para te ajudar a aprender.'} ${finished?`Na missão guardaste ${money(missionBalance())} dos 60 € do mês.`:''}</div>${resultDetails()?'<h3 class="subheading">Últimos resultados dos simuladores</h3>'+resultDetails():''}${state.legacy?`<details class="definition"><summary>Histórico da versão anterior</summary><p>${state.legacy.activities.length} atividades anteriores e ${state.legacy.points} pontos simbólicos preservados. A meta anterior foi recuperada quando válida. As novas experiências começam por explorar.</p></details>`:''}${state.goal?`<h3 class="subheading">A meta: ${esc(state.goal.name)}</h3><p class="small muted">${money(Finance.goal(state.goal.target,state.goal.initial,state.goal.entries).total)} / ${money(state.goal.target)} · Até ${formatDate(state.goal.deadline)}</p>`:''}</section><section class="card"><h2>O que levas desta experiência?</h2><div class="field"><label for="final-reflection">Uma decisão, uma consequência, uma pergunta</label><textarea id="final-reflection" maxlength="3000" placeholder="Decidi… O resultado foi… Antes de decidir numa situação real, quero saber…">${esc(state.reflection)}</textarea><small>A reflexão é guardada automaticamente. Não incluas dados pessoais.</small></div>${m?.reflection?`<h3 class="subheading">Na missão, escreveste</h3><p class="small muted">${esc(m.reflection)}</p>`:''}${state.quiz?.reflection?`<h3 class="subheading">O teu conselho a um colega</h3><p class="small muted">${esc(state.quiz.reflection)}</p>`:''}<div class="actions"><button class="btn" data-action="export">Descarregar relatório .txt ↓</button><button class="btn secondary" data-action="print">Imprimir / guardar PDF</button></div><div class="notice">O relatório reúne as escolhas da missão, os valores dos simuladores, os registos da meta e as reflexões. Entrega-o ao professor pelo meio combinado.</div><button class="text-button" data-action="reset-all">Apagar todo o progresso deste navegador</button></section></div>`}
function resultDetails(){const results=state.results&&typeof state.results==='object'?state.results:{};return Object.entries(results).filter(([id,value])=>typeof value==='string'&&value).map(([id,value])=>`<details class="definition"><summary>${esc(labs.find(x=>x[0]===id)?.[2]||'Orçamento da escola')}</summary><p style="white-space:pre-line">${esc(value)}</p></details>`).join('')}
function exportReport(){let lines=['FINANÇAJOVEM — PERCURSO DE APRENDIZAGEM','TIC, Educação e WEB',new Intl.DateTimeFormat('pt-PT',{dateStyle:'long',timeStyle:'short'}).format(new Date()),'Valores fictícios · Simulações educativas','',`Nível: ${levelName(state.level)}`,`Experiências exploradas: ${count()}/10`,''];if(state.mission){lines.push('MISSÃO — O MÊS É TEU',`Plano inicial: guardar ${money(state.mission.plan)} de 60 €`);state.mission.choices.forEach((c,i)=>lines.push(`Semana ${i+1}: ${events[i].options[c][0]} — ${money(events[i].options[c][1])}`,events[i].options[c][2]));lines.push(`Saldo ${state.mission.choices.length===4?'final':'atual'}: ${money(missionBalance())}`,`Poupança anterior: 10,00 € · Meta final: 40,00 €`);if(state.mission.reflection)lines.push('Reflexão: '+state.mission.reflection);lines.push('')}
lines.push('SIMULADORES EXPLORADOS');for(const x of labs.filter(x=>state.completed.includes(x[0])))lines.push('✓ '+x[2]);const labels={'b-income':'Orçamento: rendimento','b-essential':'Necessárias','b-leisure':'Lazer','b-saving':'Objetivo','b-reserve':'Reserva','b-shock':'Imprevisto','s-initial':'Poupança: inicial','s-monthly':'Mensal','s-months':'Meses','s-rate':'Taxa anual efetiva (%)','r-capital':'Risco: capital','r-years':'Anos','r-inflation':'Inflação (%)','c-need':'Compras: litros necessários','c-a-price':'A preço','c-a-volume':'A litros','c-b-price':'B preço','c-b-volume':'B litros','c-delivery':'B portes','k-capital':'Crédito: montante','k-rate':'TAN (%)','k-months':'Prazo A (meses)','k-fees':'Encargo inicial','t-price':'IVA: preço','t-rate':'Taxa do exercício (%)','n-price':'Negócio: preço','n-unit':'Custo/unidade','n-fixed':'Custos fixos','n-quantity':'Unidades'};lines.push(...Object.entries(state.labValues).map(([k,v])=>(labels[k]||k)+': '+v));if(state.quiz)lines.push('','DESAFIOS',`${levelName(state.quiz.level)}: ${state.quiz.score}/6 à primeira tentativa`,...questionBanks[state.quiz.level].map((q,i)=>`${i+1}. ${q[0]}\nResposta inicial: ${q[1][state.quiz.answers?.[i]]??'—'}\nIdeia a reter: ${q[3]}`),'Reflexão: '+(state.quiz.reflection||'—'));if(state.goal){const g=state.goal;lines.push('','META: '+g.name,`Inicial: ${money(g.initial)} · Objetivo: ${money(g.target)} · Limite: ${g.deadline}`,`Total guardado: ${money(Finance.goal(g.target,g.initial,g.entries).total)}`,...Object.entries(g.entries).sort().map(([d,v])=>d+': '+money(v)))}lines.push('','RESULTADOS DAS EXPERIÊNCIAS',...Object.entries(state.results||{}).map(([id,value])=>(labs.find(x=>x[0]===id)?.[2]||'Orçamento da escola')+'\n'+value));if(state.legacy)lines.push('','HISTÓRICO DA VERSÃO ANTERIOR',`Pontos simbólicos: ${state.legacy.points}`, ...state.legacy.activities);lines.push('','REFLEXÃO FINAL',state.reflection||'Ainda não registada.','','Exercícios simplificados, sem dados bancários reais.');const blob=new Blob(['\ufeff'+lines.join('\n')],{type:'text/plain;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='FinancaJovem_meu_percurso.txt';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);announce('Relatório preparado para descarregar.')}
function confirmAction(title,text,fn){$('#dialog-title').textContent=title;$('#dialog-text').textContent=text;dialogAction=fn;$('#confirm-dialog').showModal();$('#cancel-dialog').focus()}
document.addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;if(t.dataset.go){if(t.dataset.go==='laboratorio')lab='';go(t.dataset.go)}if(t.dataset.lab){lab=t.dataset.lab;go('laboratorio')}if(t.hasAttribute('data-choice')){const m=state.mission,i=Number(t.dataset.choice);if(m&&m.pending===null&&m.choices.length<4&&events[m.choices.length].options[i][1]<=missionBalance()){m.pending=i+1;save();render();announce('Escolha registada. Lê a consequência antes de avançar.')}}if(t.hasAttribute('data-answer')){const q=quizSession;if(q&&q.index<6&&q.selected===null){q.selected=Number(t.dataset.answer);if(!q.tried){q.answers[q.index]=q.selected;if(q.selected===questionBanks[q.level][q.index][2])q.score++;q.tried=true}render()}}if(t.dataset.preset){const presets={mesada:[60,20,15,15,10],estudante:[300,130,60,70,30],apertado:[60,35,20,15,10]};['b-income','b-essential','b-leisure','b-saving','b-reserve'].forEach((id,i)=>$('#'+id).value=presets[t.dataset.preset][i]);$('#b-shock').value='0';calcBudget(false)}const action=t.dataset.action;if(action==='back-labs'){lab='';go('laboratorio')}if(action==='restart-mission')confirmAction('Experimentar outro mês?','As escolhas e a reflexão da missão atual serão substituídas. O resto do percurso mantém-se.',()=>{state.mission=null;state.completed=state.completed.filter(x=>x!=='missao');save();render()});if(action==='mission-next'){const m=state.mission;if(m&&m.pending!==null){m.choices.push(m.pending-1);m.pending=null;if(m.choices.length===4)complete('missao');save();render();$('#main').focus();window.scrollTo({top:0,behavior:'instant'})}}if(action==='start-quiz'){quizSession={level:state.level,index:0,score:0,selected:null,tried:false,answers:[]};render()}if(action==='retry-question'&&quizSession){quizSession.selected=null;render()}if(action==='next-question'&&quizSession&&quizSession.selected!==null){quizSession.index++;quizSession.selected=null;quizSession.tried=false;if(quizSession.index===6){state.quiz={level:quizSession.level,score:quizSession.score,answers:quizSession.answers,reflection:''};complete('quiz');save()}render();$('#main').focus()}if(action==='reset-goal')confirmAction('Criar outra meta?','O plano e os registos diários da meta atual serão apagados. Descarrega o relatório primeiro, se quiseres guardá-los.',()=>{state.goal=null;state.completed=state.completed.filter(x=>x!=='meta');save();render()});if(action==='export')exportReport();if(action==='print')window.print();if(action==='reset-all')confirmAction('Apagar todo o progresso?','Isto apaga as escolhas, os resultados, as metas e as reflexões guardadas neste navegador. Podes descarregar o relatório antes.',()=>{state=defaults();quizSession=null;lab='';storageNote='';try{localStorage.removeItem('financajovem.v2')}catch(e){}save();go('inicio')})});
$('#cancel-dialog').addEventListener('click',()=>{$('#confirm-dialog').close();dialogAction=null});$('#accept-dialog').addEventListener('click',()=>{const fn=dialogAction;dialogAction=null;$('#confirm-dialog').close();fn?.()});$('#confirm-dialog').addEventListener('cancel',()=>dialogAction=null);
$('#level').addEventListener('change',e=>{state.level=e.target.value;save();if(route==='desafios')quizSession=null;render();announce('Percurso recomendado: '+levelName(state.level))});
document.addEventListener('input',e=>{if(e.target.id==='final-reflection'){state.reflection=e.target.value;save()}if(e.target.id==='mission-reflection'&&state.mission){state.mission.reflection=e.target.value;save()}if(e.target.id==='quiz-reflection'&&state.quiz){state.quiz.reflection=e.target.value;save()}if(e.target.closest('#budget-form'))calcBudget(false)});
document.addEventListener('change',e=>{if(e.target.id==='b-shock')calcBudget(false);if(e.target.id==='g-day'&&state.goal)$('#g-amount').value=state.goal.entries[e.target.value]||0});
document.addEventListener('submit',e=>{e.preventDefault();const id=e.target.id;if(id==='mission-start'){try{const plan=read('mission-plan');state.mission={plan,choices:[],pending:null,reflection:''};save();render()}catch(err){announce(err.message)}}if(id==='budget-form')calcBudget(true);if(id==='savings-form')calcSavings();if(id==='risk-form')calcRisk();if(id==='shopping-form')calcShopping();if(id==='credit-form')calcCredit();if(id==='tax-form')calcTax();if(id==='business-form')calcBusiness();if(id==='school-form'){try{const ns=['t-books','t-sport','t-access'].map(read),sum=ns.reduce((a,b)=>a+b,0);$('#school-result').innerHTML=`<div class="notice ${sum>1000?'error':'green'}">${sum>1000?'Excedes o orçamento em '+money(sum-1000)+'. Revê a distribuição.':sum<1000?'Ficam '+money(1000-sum)+' por atribuir. Decide se os queres manter como reserva.':'Distribuíste os 1 000 €. Aumentar uma proposta implica reduzir outra.'}<br>Livros: ${money(ns[0])} · Desporto: ${money(ns[1])} · Acessibilidade: ${money(ns[2])}.</div>`;if(sum<=1000)complete('iva')}catch(err){$('#school-result').textContent=err.message}}if(id==='goal-start'){try{const target=read('g-target'),initial=read('g-initial'),deadline=$('#g-deadline').value,name=$('#g-name').value.trim();if(!name)throw Error('Dá um nome à tua meta.');if(initial>target)throw Error('O valor inicial não pode superar a meta.');if(deadline<Finance.date())throw Error('Escolhe hoje ou uma data futura.');state.goal={name,target,initial,start:Finance.date(),deadline,entries:{}};complete('meta');save();render()}catch(err){labError(err.message)}}if(id==='goal-record'){try{const day=$('#g-day').value,amount=read('g-amount'),g=state.goal;if(day<g.start||day>Finance.date()||day>g.deadline)throw Error('Escolhe um dia entre o início do plano e hoje, dentro do prazo.');g.entries[day]=amount;save();render();announce('Valor do dia guardado. Um registo anterior desse dia foi substituído.')}catch(err){labError(err.message)}}});
const resultTargets={'budget-form':['orcamento','#budget-result'],'savings-form':['poupanca','#savings-result'],'risk-form':['risco','#risk-result'],'shopping-form':['compras','#shopping-result'],'credit-form':['credito','#credit-result'],'tax-form':['iva','#tax-result'],'business-form':['negocio','#business-result'],'school-form':['escola','#school-result']};
document.addEventListener('submit',e=>{const target=resultTargets[e.target.id];if(!target||$('#lab-error')?.textContent)return;const output=$(target[1]);if(output&&output.innerText.trim()){if(!state.results||typeof state.results!=='object')state.results={};state.results[target[0]]=output.innerText;save()}});
function bindView(){if(route==='laboratorio'&&lab==='orcamento'){const e=$('#b-shock');e.value=state.labValues['b-shock']||'0';calcBudget(false)}}
window.addEventListener('hashchange',()=>{const name=location.hash.slice(1);if(name!==route)go(name)});
go(location.hash.slice(1)||'inicio',false);
</script>
